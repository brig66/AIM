function engineTable(d){
  const rows=(d.rankings_by_engine||[]);
  if(!rows.length)return '<p class="exp">No ranking data in this period.</p>';
  const byEng={}; rows.forEach(r=>{byEng[r.engine]=r});
  const ordered=ENG_ORDER.map(k=>byEng[k]).filter(Boolean)
    .concat(rows.filter(r=>ENG_ORDER.indexOf(r.engine)<0));
  // page2 is read straight from the RPC, which counts 11-20 exactly. Page 3 and
  // beyond is the remainder, derived so that the row always adds up to tracked.
  const sum=k=>ordered.reduce((a,r)=>a+(Number(r[k])||0),0);
  const row=r=>{
    const tracked=Number(r.tracked)||0,p1=Number(r.page1)||0,p2=Number(r.page2)||0;
    return `<tr><td>${esc(ENGN[r.engine]||r.engine)}</td>
      <td class="n num">${n(r.top3)}</td><td class="n num">${n(r.p4_10)}</td>
      <td class="n num"><b>${n(p1)}</b></td>
      <td class="n num">${n(p2)}</td>
      <td class="n num">${n(Math.max(0,tracked-p1-p2))}</td>
      <td class="n num">${n(tracked)}</td></tr>`;
  };
  const tTracked=sum('tracked'),tP1=sum('page1'),tP2=sum('page2');
  return `<div class="tw"><table><thead><tr><th>Search engine</th>
    <th class="n">Positions 1–3</th><th class="n">Positions 4–10</th>
    <th class="n">Ranking 1–10</th><th class="n">Page 2 (11–20)</th>
    <th class="n">Page 3 and beyond</th><th class="n">Tracked</th></tr></thead><tbody>
    ${ordered.map(row).join('')}
    <tr class="total"><td>All engines combined</td>
      <td class="n num">${n(sum('top3'))}</td><td class="n num">${n(sum('p4_10'))}</td>
      <td class="n num"><b>${n(tP1)}</b></td>
      <td class="n num">${n(tP2)}</td>
      <td class="n num">${n(Math.max(0,tTracked-tP1-tP2))}</td>
      <td class="n num">${n(tTracked)}</td></tr>
  </tbody></table></div>
  <p class="exp" style="margin-top:11px">Each engine is counted separately, so a phrase ranking
  on three engines contributes to all three rows and the combined row counts it three times —
  these are placements, not unique phrases. <b>Page 2 is striking distance</b>: positions 11–20,
  where a modest gain moves a phrase onto page one. Page 3 and beyond is everything below that,
  and includes phrases that do not appear in the top 100 at all.</p>`;
}

/* ---------- keyword matrix ---------- */
// Engine order is the one the report reads in, not alphabetical.
const ENG_ORDER=['google','google_local','google_mobile','bing'];
// dash_keywords answers for one engine at a time, so the matrix is four reads
// joined on the phrase. 101 is the collector's "outside the top 100" sentinel.
const NR=101;
const posOf=r=>{const v=r.end_pos==null?r.best_pos:r.end_pos;
  return (v==null||Number(v)>=NR)?null:Number(v)};

function mergeKeywords(engines,sets){
  const by=new Map();
  engines.forEach((eng,i)=>{
    for(const r of (sets[i]||[])){
      const key=String(r.phrase||'').trim().toLowerCase();
      if(!key)continue;
      let row=by.get(key);
      if(!row){row={phrase:r.phrase,url:null};by.set(key,row)}
      row[eng]=posOf(r);
      if(!row.url&&r.ranked_url)row.url=r.ranked_url;
    }
  });
  const out=[...by.values()];
  for(const r of out){
    const vals=ENG_ORDER.map(e=>r[e]).filter(v=>v!=null);
    r.best=vals.length?Math.min(...vals):null;
    r.p1=ENG_ORDER.filter(e=>r[e]!=null&&r[e]<=10);
  }
  return out;
}

function posCell(v){
  if(v==null)return '<span class="pos nr">—</span>';
  const c=v<=3?'t3':v<=10?'p1':v<=20?'p2':'';
  return `<span class="pos ${c}">${v}</span>`;
}

function sortKeywords(rows){
  const {col,dir}=S.kwSort||{col:'best',dir:1};
  const cp=[...rows];
  cp.sort((a,b)=>{
    if(col==='phrase')return dir*String(a.phrase).localeCompare(String(b.phrase));
    const x=a[col],y=b[col];
    // Terms that do not rank always sort last, whichever direction is chosen —
    // otherwise "sort best first" fills the top with blanks.
    if(x==null&&y==null)return String(a.phrase).localeCompare(String(b.phrase));
    if(x==null)return 1;
    if(y==null)return -1;
    return dir*(x-y)||String(a.phrase).localeCompare(String(b.phrase));
  });
  return cp;
}

function kwHead(){
  const s=S.kwSort||{col:'best',dir:1};
  // Position headings carry the "n" class so the label sits over its numbers
  // rather than at the far side of the column.
  const th=(col,label,num)=>{
    const on=s.col===col;
    return `<th data-sort="${col}" class="${num?'n ':''}${on?'on':''}"
      title="Sort by ${esc(label)}">${esc(label)}<span class="ar">${
        on?(s.dir===1?'▲':'▼'):'▲'}</span></th>`;
  };
  return `<thead><tr>${th('phrase','Search phrase',false)}
    ${th('google','Google',true)}${th('bing','Bing',true)}
    ${th('google_mobile','Google Mobile',true)}${th('google_local','Google Local',true)}
  </tr></thead>`;
}

function keywordMatrix(){
  const all=S.kw;
  if(all===null)return `<div class="pending"><b>Rank detail is unavailable.</b>
    The per-keyword endpoint did not answer, so no positions are shown rather than a
    placeholder.</div>`;
  if(!all.length)return '<p class="exp">No tracked phrases in this period.</p>';

  const q=String(S.kwFilter||'').trim().toLowerCase();
  const rows=sortKeywords(q?all.filter(r=>String(r.phrase).toLowerCase().includes(q)):all);
  const page1=all.filter(r=>r.best!=null&&r.best<=10);

  return `<div class="tbar">
      <input class="filt" id="kwq" type="search" placeholder="Filter phrases…"
        value="${esc(S.kwFilter||'')}">
      <span class="cnt">${n(rows.length)} of ${n(all.length)} phrases · ${
        n(page1.length)} on page one</span>
      <button class="xbtn" data-act="kw-xlsx"${page1.length?'':' disabled'}>
        Export page-one phrases (.xlsx)</button>
      <button class="xbtn" data-act="kw-all-xlsx">Export all (.xlsx)</button>
    </div>
    <div class="tw"><table class="matrix">${kwHead()}<tbody>
    ${rows.map(r=>`<tr><td title="${esc(r.url||'')}">${esc(r.phrase)}</td>
      ${ENG_ORDER.map(e=>`<td class="p">${posCell(r[e])}</td>`).join('')}
    </tr>`).join('')}
    </tbody></table></div>
    <p class="exp" style="margin-top:11px">Position at the end of the reporting window.
    <span class="pos t3">1–3</span> top three · <span class="pos p1">4–10</span> rest of page one
    · <span class="pos p2">11–20</span> page two · — not in the top 100.
    Click any column heading to sort; click again to reverse.</p>`;
}

function kwExportRows(onlyPage1){
  const src=(S.kw||[]).filter(r=>onlyPage1?(r.best!=null&&r.best<=10):true);
  const head=['Search phrase','Google','Bing','Google Mobile','Google Local',
              'Best position','Engines on page one','Ranking URL'];
  const body=sortKeywords(src).map(r=>[
    r.phrase,
    r.google==null?'Not in top 100':r.google,
    r.bing==null?'Not in top 100':r.bing,
    r.google_mobile==null?'Not in top 100':r.google_mobile,
    r.google_local==null?'Not in top 100':r.google_local,
    r.best==null?'':r.best,
    r.p1.map(e=>ENGN[e]).join(', '),
    r.url||'']);
  return [head,...body];
}

/* ---------- Traffic tab ---------- */
// dash_traffic is per day; the tab reports a period, so fold the days together.
// Rates are session-weighted; counts are summed.
function foldTraffic(daily){
  const by=new Map();
  for(const r of daily||[]){
    const k=r.channel||'Unassigned';
    let a=by.get(k);
    if(!a){a={channel:k,sessions:0,users:0,new_users:0,_eng:0,_bnc:0,_d:0};by.set(k,a)}
    const s=Number(r.sessions)||0;
    a.sessions+=s; a.users+=Number(r.users)||0; a.new_users+=Number(r.new_users)||0;
    if(r.engagement_rate!=null){a._eng+=Number(r.engagement_rate)*s}
    if(r.bounce_rate!=null){a._bnc+=Number(r.bounce_rate)*s}
    a._d+=s;
  }
  const out=[...by.values()];
  for(const a of out){
    a.engagement=a._d>0?a._eng/a._d*100:null;
    a.bounce=a._d>0?a._bnc/a._d*100:null;
  }
  return out.sort((x,y)=>y.sessions-x.sessions);
}

// Risk bands come from the collector's own risk_score, which already weighs
// country, session length, engagement and browser. Presented as an estimate,
// because that is what it is — no analytics product can identify a bot for certain.
function riskBand(v){
  const r=Number(v)||0;
  if(r>=50)return{k:'auto',label:'Almost certainly automated',col:'var(--c2)'};
  if(r>=25)return{k:'susp',label:'Probably automated',col:'var(--c3)'};
  return{k:'human',label:'Consistent with human visits',col:'var(--c7)'};
}

function botEstimate(){
  const t=S.tech;
  if(t===null)return `<div class="pending"><b>The automation estimate is unavailable.</b>
    The technology endpoint did not answer, so no estimate is shown rather than a guess.</div>`;
  if(!t||!t.length)return `<div class="pending"><b>Nothing to score yet.</b>
    No country or device detail was returned for this period.</div>`;

  const band={auto:0,susp:0,human:0};
  let total=0;
  for(const r of t){const s=Number(r.sessions)||0;band[riskBand(r.risk_score).k]+=s;total+=s}
  if(!total)return '<p class="exp">No sessions to score in this period.</p>';
  const w=v=>(100*v/total).toFixed(2)+'%';
  const pc=v=>(100*v/total).toFixed(1)+'%';

  const worst=[...t].sort((a,b)=>(Number(b.risk_score)||0)-(Number(a.risk_score)||0)
    ||(Number(b.sessions)||0)-(Number(a.sessions)||0)).slice(0,12);

  return `<div class="botbar" title="${n(band.auto)} almost certainly automated · ${
      n(band.susp)} probably automated · ${n(band.human)} consistent with human">
      <span style="width:${w(band.auto)};background:var(--c2)">${
        band.auto/total>.1?`<em>${pc(band.auto)}</em>`:''}</span>
      <span style="width:${w(band.susp)};background:var(--c3)">${
        band.susp/total>.1?`<em>${pc(band.susp)}</em>`:''}</span>
      <span style="width:${w(band.human)};background:var(--c7)">${
        band.human/total>.1?`<em>${pc(band.human)}</em>`:''}</span>
    </div>
    <div class="legend" style="margin-top:0">
      <div class="lg"><span class="sw" style="background:var(--c2)"></span>Almost certainly
        automated — ${n(band.auto)} sessions (${pc(band.auto)})</div>
      <div class="lg"><span class="sw" style="background:var(--c3)"></span>Probably automated —
        ${n(band.susp)} (${pc(band.susp)})</div>
      <div class="lg"><span class="sw" style="background:var(--c7)"></span>Consistent with human
        visits — ${n(band.human)} (${pc(band.human)})</div>
    </div>
    <h3>Where the doubtful traffic comes from</h3>
    <div class="tw"><table><thead><tr><th>Country</th><th>Device</th>
      <th class="n">Sessions</th><th class="n">Avg time</th><th class="n">Engaged</th>
      <th class="n">Risk</th><th>Why it was scored that way</th></tr></thead><tbody>
    ${worst.map(r=>{const b=riskBand(r.risk_score);
      return `<tr><td>${esc(r.country||'Unknown')}</td><td>${esc(r.device_category||'—')}</td>
        <td class="n num">${n(r.sessions)}</td>
        <td class="n num">${r.avg_secs==null?'—':Math.round(Number(r.avg_secs))+'s'}</td>
        <td class="n num">${r.engaged_pct==null?'—':Number(r.engaged_pct).toFixed(0)+'%'}</td>
        <td class="n"><span class="risk" style="color:${b.col}">${
          r.risk_score==null?'—':r.risk_score}</span></td>
        <td class="exp">${esc((r.signals||[]).join(' · '))||'—'}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="exp" style="margin-top:11px"><b>This is an estimate, not a measurement.</b>
    Sessions are scored on the country they came from, how long they lasted, whether anything on
    the page was engaged with, and the browser reported. A high score means the visit behaves
    like automated traffic — it is not proof, and a real person on a slow connection can score
    high. Treat it as a reason to look, not a number to report to a client as fact.</p>`;
}

function traffic(d){
  const rows=S.trafficDaily?foldTraffic(S.trafficDaily):null;
  const t=rows&&rows.length?rows:(d.traffic||[]);
  const haveNew=!!(rows&&rows.some(r=>r.new_users>0));
  const tot=t.reduce((a,c)=>({s:a.s+Number(c.sessions||0),u:a.u+Number(c.users||0),
    nu:a.nu+Number(c.new_users||0),c:a.c+Number(c.conversions||0)}),{s:0,u:0,nu:0,c:0});

  const table=t.length?`<div class="tw"><table><thead><tr><th>Channel</th>
    <th class="n">Sessions</th><th class="n">Users</th>
    ${haveNew?'<th class="n">First-time</th><th class="n">Returning</th>':''}
    <th class="n">Engagement</th></tr></thead><tbody>
    ${t.map(r=>{const u=Number(r.users)||0,nu=Number(r.new_users)||0;
      return `<tr><td>${esc(r.channel)}</td><td class="n num">${n(r.sessions)}</td>
      <td class="n num">${n(u)}</td>
      ${haveNew?`<td class="n num">${n(nu)}</td>
        <td class="n num">${n(Math.max(0,u-nu))}</td>`:''}
      <td class="n num">${r.engagement==null?'—':Number(r.engagement).toFixed(1)+'%'}</td></tr>`
    }).join('')}
    <tr class="total"><td>Total</td><td class="n num">${n(tot.s)}</td>
      <td class="n num">${n(tot.u)}</td>
      ${haveNew?`<td class="n num">${n(tot.nu)}</td>
        <td class="n num">${n(Math.max(0,tot.u-tot.nu))}</td>`:''}
      <td class="n">—</td></tr></tbody></table></div>`
   :'<p class="exp">No traffic data in this period.</p>';

  const donuts=t.length?`<div class="dnuts" style="margin-top:15px">
    ${donutCard('Total Users','Everyone who visited, by channel',
       t.filter(r=>Number(r.users)>0).map(r=>({k:r.channel,v:Number(r.users)})))}
    ${haveNew?donutCard('First-time Visitors','People arriving for the first time, by channel',
       t.filter(r=>Number(r.new_users)>0).map(r=>({k:r.channel,v:Number(r.new_users)})))
      :donutPending('First-time Visitors','People arriving for the first time, by channel',
       'No first-time visitor counts were returned for this period.')}
    </div>`:'';

  return `<section><p class="kick">Website Traffic</p><h2>Where visitors came from</h2>
  <p class="exp">Engagement is the share of visits where someone stayed, scrolled or interacted.
  ${haveNew?'First-time visitors are people GA4 had not seen before; returning is the remainder.':''}</p>
  ${table}${donuts}
  <h3>Sessions by month</h3>${barChart(d.traffic_months,'sessions','month',r=>r.days<26)}</section>
  ${isAdmin()?`<section><p class="kick">Traffic Quality</p>
  <h2>Human or automated — an estimate${intBadge}</h2>
  <p class="intnote">Working material. A client does not see this section — an estimate that
  half their visits are machines reads as an accusation, and it is a signal to act on, not a
  figure to hand over.</p>
  <p class="exp">Not every session is a person. This scores each country and device combination
  on how much its behaviour resembles automated traffic, so headline visit counts can be read
  with that in mind.</p>
  ${botEstimate()}</section>`:''}`;
}

/* ---------- form reclassification (AIM only) ----------
   The rule that runs at ingest promotes anything with contact details and three
   or more fields to a valid lead, which is how vendor pitches reached client
   reports. This asks a model to read the message instead.

   Preview before apply, always: these numbers may already have been quoted to a
   client, so the change is shown as a list of moves before anything is written. */

const CLASS_LABEL={valid_lead:'Valid lead',needs_review:'Needs review',

  test_submission:'Test submission'};
const CLASS_BADGE={valid_lead:'good',needs_review:'info',needs_attention:'warn',
  suspicious:'warn',spam:'warn',test_submission:'info'};

function reclassPanel(){
  if(!isAdmin())return '';
  const r=S.reclass;
  const busy=S.reclassBusy;

  const moves=r&&r.changes?r.changes.filter(c=>c.to&&c.from!==c.to):[];
  const same=r&&r.changes?r.changes.filter(c=>c.to&&c.from===c.to).length:0;
  const errs=r&&r.changes?r.changes.filter(c=>c.error):[];

  return `<section><h3>Re-read these submissions${intBadge}</h3>
    <p class="intnote">Working material. Clients never see this control.</p>
    <p class="exp">Submissions are sorted at collection time by a fixed rule that
    counts fields rather than reading them — anything with contact details and three
    filled boxes becomes a valid lead. This re-reads the actual message and sorts it
    the way the Form Report skill would: a genuine customer enquiry, a vendor pitch,
    a scam pattern, or something a person should look at.</p>
    <div class="tbar">
      <button class="xbtn" data-act="reclass-preview" ${busy?'disabled':''}>${

async function doReclass(act){
  const dry=act==='reclass-preview';
  S.reclassErr=''; S.reclassBusy=dry?'preview':'apply'; render();
  try{
    const r=await apiPost('/api/forms_reclassify',
      {limit:200,dry_run:dry,client:S.client});
    if(r&&r.error)throw new Error(r.detail||r.error);
    S.reclass=r;
    if(!dry){
      // The tab's counts come from the report bundle, so re-read it after a write.
      const q=`?client=${S.client}&from=${S.from}&to=${S.to}&limit=200`;
      try{ S.forms=await api('/api/forms'+q); S.data=S.forms.report||S.data; }catch(_e){}
    }
  }catch(e){
    if(e.message!=='unauthorized')S.reclassErr=e.message;
  }
  S.reclassBusy=null; render();
}

/* ---- actions ---- */
async function doClientAct(act){
  const [kind,id,extra]=act.split(':');
  S.cErr=''; S.cMsg='';
  const val=i=>{const el=$(i);return el&&el.value!=null?String(el.value).trim():''};
  try{
    if(kind==='client-new'){S.cNew=!S.cNew;
      if(!S.cNew)S.cNewDraft=null;
      render();return}
    if(kind==='client-edit'){
      S.cEdit=S.cEdit===Number(id)?null:Number(id); S.cKw=null; render(); return}
    if(kind==='client-kw'){
      const open=S.cKw===Number(id);
      S.cKw=open?null:Number(id); S.cEdit=null; S.cRecent=null;
      render();
      if(!open){
        try{ S.cRecent=await api(`/api/keywords_recent?client=${id}&limit=25`)||[]; }
        catch(_e){ S.cRecent=[]; }
        render();
      }
      return}

    if(kind==='client-create'){
      const name=val('cn-name'),domain=val('cn-domain'),scope=val('cn-scope')||'local';
      if(!name||!domain){S.cErr='A name and a domain are both needed.';render();return}
      // Held across the re-render, so a refused create does not make the name
      // and domain be retyped.
      S.cNewDraft={name,domain,scope};
      S.cBusy='new'; render();
      const r=await apiPost('/api/client_add',{name,domain,market_scope:scope});
      S.cNew=false; S.cNewDraft=null; S.cMsg='Client created.';
      // Open the new client straight into its edit panel: it is not collecting
      // anything until GA4 and Search Console are filled in.
      const made=(r.result&&r.result[0])||null;
      if(made&&made.new_id)S.cEdit=Number(made.new_id);
    }else if(kind==='client-save'){
      // Read every field BEFORE anything re-renders. render() replaces the
      // tab's markup, which destroys these inputs and rebuilds them from the
      // stored record — reading after that sends back what was already saved
      // rather than what was typed, which silently wrote nulls.
      const patch={
        name:val('ce-name'),domain:val('ce-domain'),
        ga4_property_id:val('ce-ga4')||null,
        gsc_site_url:val('ce-gsc')||null,
        gbp_location_id:val('ce-gbp')||null,
        market_scope:val('ce-scope')||'local'};
      // Held so the busy re-render shows what was typed instead of blanking it.
      S.cDraft={id:Number(id),patch};
      S.cBusy='save'; render();
      await apiPost('/api/client_update',{id:Number(id),patch});
      // The reloaded list below is now the truth, so the draft is done with.
      S.cDraft=null;
      S.cMsg='Saved.';
    }else if(kind==='client-active'){
      S.cBusy='save'; render();
      await apiPost('/api/client_update',{id:Number(id),patch:{active:extra==='1'}});
    }else if(kind==='kw-add'){
      const loc=val('ck-loc');
      const raw=$('ck-phrases'), text=raw&&raw.value?String(raw.value):'';
      const phrases=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      if(!loc){S.cErr='Give the location the rank check should run from.';render();return}
      if(!phrases.length){S.cErr='Paste at least one phrase.';render();return}
      S.cBusy='kw'; S.cLoc=loc; render();
      const r=await apiPost('/api/keywords_add',{client:Number(id),phrases,location:loc});
      const res=(r.result&&r.result[0])||{};
      S.cErr=`Added ${n(res.n_added||0)} phrase${(res.n_added||0)===1?'':'s'}${
        res.n_skipped?`, ${n(res.n_skipped)} already tracked`:''}.`;
      try{ S.cRecent=await api(`/api/keywords_recent?client=${id}&limit=25`)||[]; }catch(_e){}
    }else if(kind==='kw-remove'){
      const readings=Number(extra)||0;
      const msg=readings
        ? `This phrase has ${readings} rank reading${readings===1?'':'s'}. Removing it stops future checks but keeps that history. Continue?`
        : 'Remove this phrase? It has never been checked, so it will be deleted outright.';
      if(!window.confirm(msg))return;
      S.cBusy='kw'; render();
      await apiPost('/api/keyword_remove',{id:Number(id)});
      if(S.cKw){try{ S.cRecent=await api(`/api/keywords_recent?client=${S.cKw}&limit=25`)||[]; }catch(_e){}}
    }
  }catch(e){
    if(e.message!=='unauthorized')S.cErr=e.message;
    S.cMsg='';   // the draft is deliberately kept, so a retry still has the values
  }
  S.cBusy=null;
  // The client list carries the readiness flags, so it is re-read after any write.
  try{ S.cAdmin=await api('/api/clients_admin')||[]; }catch(_e){}
  // A new or renamed client has to reach the picker too.
  try{
    S.clients=await api('/api/clients')||S.clients;
    $('client').innerHTML=S.clients.map(c=>
      `<option value="${c.id}"${c.id===S.client?' selected':''}>${esc(c.name)}</option>`).join('');
  }catch(_e){}
  render();
}

async function doPromptAct(act){

        ? `This question has ${collected} answer${collected===1?'':'s'} recorded. Removing it stops future runs but keeps that history. Continue?`
        : 'Remove this question? It has never been asked, so it will be deleted outright.';
      if(!window.confirm(msg))return;
      S.promptBusy=id; render();

/* ---------- AI Visibility: branded vs non-branded ---------- */
// A branded prompt is someone already searching for the firm by name, so it
// almost always cites them. Blending it into one headline rate flatters the
// number; the discovery rate is the one that reflects winning new clients.
function intentSplit(a){
  const bi=a.by_intent||[];
  const find=re=>bi.filter(x=>re.test(String(x.kind||'')))[0]||null;
  let branded=find(/brand/i),discovery=find(/discover|non|unbrand/i);
  if(!branded&&!discovery&&(a.prompts||[]).length){
    // Fall back to the per-prompt flag if the RPC did not pre-aggregate.
    const agg=flag=>{
      const p=(a.prompts||[]).filter(x=>!!x.branded===flag);
      if(!p.length)return null;
      const ans=p.reduce((s,x)=>s+(Number(x.engines)||0),0);
      const cit=p.reduce((s,x)=>s+(Number(x.cited)||0),0);
      const men=p.reduce((s,x)=>s+(Number(x.mentioned)||0),0);
      return{kind:flag?'Branded questions':'Discovery questions',answers:ans,
        citation_rate:ans?100*cit/ans:null,mention_rate:ans?100*men/ans:null,
        sov:p.reduce((s,x)=>s+(Number(x.sov)||0),0)/p.length};
    };
    branded=agg(true); discovery=agg(false);
  }
  return{branded,discovery};
}

/* ---------- Backlinks: value flags + disavow ---------- */
// Toxicity decides toxic; among the rest, a strong referring domain is what
// makes a link worth having. Both numbers come from the collector.
function linkValue(r){
  const tox=Number(r.toxicity)||0, rank=r.best_rank==null?null:Number(r.best_rank);
  if(tox>=40)return{k:'tox',label:'Toxic'};
  if(tox<20&&rank!=null&&rank>=50)return{k:'hi',label:'High value'};
  return{k:'lo',label:'Low value'};
}
function disavowText(){
  const tox=(S.toxic||[]).filter(r=>linkValue(r).k==='tox');
  const c=cliRow();
  const head=['# Google Disavow file',
    `# ${c.name||''}${c.domain?' · '+c.domain:''}`,
    `# Generated ${iso(new Date())} from the AIM analytics dashboard`,
    `# ${tox.length} domain${tox.length===1?'':'s'} scoring 40 or above on the toxicity rubric`,
    '# Review every line before submitting. A disavow filed in error can cost rankings.',''];
  return head.concat(tox.map(r=>'domain:'+String(r.source_domain||'').trim())).join('\n')+'\n';
}

/* ---------- Readiness trend ---------- */
function readinessTrend(type){
  const h=(S.auditHist||{})[type]||[];
  if(h.length<2)return `<p class="exp" style="margin-top:10px">${
    h.length===1?'Only one run recorded so far — the trend appears once this audit is re-run.'
                :'No run history recorded yet.'}</p>`;
  const pts=h.map(r=>({d:r.run_date,v:Number(r.overall_score)||0,g:r.grade}));
  const max=Math.max(...pts.map(p=>p.v),100);
  const first=pts[0].v,last=pts[pts.length-1].v,delta=last-first;
  return `<h3 style="margin-top:16px">Score over time</h3>
    <div class="trend">${pts.map(p=>`<div class="tb" title="${esc(p.d)} — ${
      p.v} (${esc(p.g||'')})">
      <span class="tv" style="color:${bandColor(p.v)}">${Math.round(p.v)}</span>
      <span class="tf" style="height:${Math.max(3,100*p.v/max)}%;background:${
        bandColor(p.v)}"></span></div>`).join('')}</div>
    <div class="trendx">${pts.map(p=>`<span>${esc(String(p.d).slice(5))}</span>`).join('')}</div>
    <p class="exp" style="margin-top:9px">${
      delta>0?`Up <b>${delta.toFixed(1)}</b> points since ${esc(pts[0].d)}.`
      :delta<0?`Down <b>${Math.abs(delta).toFixed(1)}</b> points since ${esc(pts[0].d)}.`
      :`Unchanged since ${esc(pts[0].d)}.`} Each bar is one audit run — the score moves when the
      site changes and the audit is run again.</p>`;
}

function ai(d){
  const a=d.aiFull||null;
  const LBL={openai:'ChatGPT',gemini:'Google Gemini',anthropic:'Claude',
             perplexity:'Perplexity'};
  if(!a||!a.results)return `<section><p class="kick">AI Search Practice</p>
    <h2>AI assistant visibility</h2>
    <p class="exp">No tracker run inside this window. AI visibility runs on a monthly
    cadence — widen the date range to include the most recent run.</p></section>`
    + promptManager();

  const cli=(S.clients.filter(c=>c.id==S.client)[0]||{}).name||'';
  const now=a.now||{};
  const eng=a.by_engine||[];
  const pr=a.prompts||[];
  const r1=v=>v==null?'—':Number(v).toFixed(1).replace(/\.0$/,'');

  const stat=(v,unit,label,desc)=>`<div class="stat">
    <div class="v">${v}${unit?`<small>${unit}</small>`:''}</div>
    <div class="l">${label}</div><div class="d">${desc}</div></div>`;

  // Header mirrors the monitoring PDF: who, when, and the size of the sample the
  // percentages are computed from — a rate with no denominator is not evidence.
  const head=`<div class="rhead"><div class="grad"></div><div class="in">
    <p class="eyebrow">AI Visibility · Monitoring</p>
    <h2>${esc(cli)}</h2>
    <p class="meta">${esc(a.day||'')} · ${pr.length} prompts × ${eng.length} engines
    = ${n(a.results)} answers analysed${a.failures?` · ${n(a.failures)} failed`:''}</p>
  </div></div>`;

  // Branded questions almost always cite the firm, so a blended rate flatters the
  // number. The non-branded figures lead; the blended pair is kept below, labelled.
  const sp=intentSplit(a);
  const dis=sp.discovery,brd=sp.branded;
  const tiles=`<div class="stats">
    ${stat(r1(dis?dis.citation_rate:null),'%','Citation rate — non-branded',
      'Questions that never name the firm'+(dis?` · ${n(dis.answers)} answers`:''))}
    ${stat(r1(dis?dis.mention_rate:null),'%','Mention rate — non-branded',
      'Answers naming the firm when the question did not')}
    ${stat(r1(dis?dis.sov:null),'%','Share of voice — non-branded',
      'Mentions against every tracked competitor')}
    ${stat(r1(brd?brd.citation_rate:null),'%','Citation rate — branded',
      'Asked about by name'+(brd?` · ${n(brd.answers)} answers`:'')+
      ' — reported apart, not blended in')}
  </div>
  <div class="callout"><b>Why these are split.</b> A branded question is someone who has already
  found the firm and is asking about it by name; AI nearly always cites them back. Blending that
  into one number inflates it. The non-branded rates are the ones that show whether AI recommends
  this firm to someone who has never heard of it. Blended across every question, citation runs
  ${r1(now.citation_rate)}% and mention ${r1(now.mention_rate)}%.</div>`;

  const sent=a.sentiment||{};
  const comp=a.competitors||[];
  const topComp=comp.length?comp[0]:null;
  const callout=`<div class="callout">Across <b>${n(a.results)}</b> AI answers this period,
    ${esc(cli)} was cited in <b>${r1(now.citation_rate)}%</b> and named in
    <b>${r1(now.mention_rate)}%</b>.
    ${now.comp_rate!=null?`A competitor appeared in <b>${r1(now.comp_rate)}%</b> of answers.`:''}
    ${topComp?` Most-mentioned competitor: <b>${esc(topComp.name)}</b> (${n(topComp.mentions)}).`:''}
    Sentiment where mentioned: negative ${n(sent.negative||0)} ·
    neutral ${n(sent.neutral||0)} · positive ${n(sent.positive||0)}.</div>`;

  const maxCite=Math.max(...eng.map(e=>Number(e.citation_rate)||0),1);
  const engTable=`<h3>Performance by AI engine</h3>
    <div class="tw"><table><thead><tr><th>Engine</th><th class="n">Answers</th>
      <th class="n">Mention</th><th>Citation rate</th></tr></thead><tbody>
    ${eng.map(e=>{const v=Number(e.citation_rate)||0;
      const col=v>=maxCite&&v>0?'var(--orange)':'var(--magenta)';
      return `<tr><td><b>${esc(LBL[e.engine]||e.engine)}</b></td>
        <td class="n num">${n(e.results)}</td>
        <td class="n num">${r1(e.mention_rate)}%</td>
        <td><span class="bt"><span class="bf" style="width:${(v/maxCite*100).toFixed(1)}%;
          background:${col}"></span></span>
          <span class="num" style="font-weight:600">${r1(v)}%</span></td></tr>`;
    }).join('')}</tbody></table></div>`;

  // Intent split is the most actionable cut: winning branded questions while losing
  // discovery questions means AI knows the firm but does not recommend it.
  const bi=a.by_intent||[];
  const intent=bi.length?`<h3>Branded vs discovery questions</h3>
    <p class="exp">Branded questions are people already asking about the firm by name.
    Discovery questions are people describing a need with no firm in mind — that is where
    new clients come from.</p>
    <div class="tw"><table><thead><tr><th>Question type</th><th class="n">Answers</th>
      <th class="n">Mention</th><th class="n">Citation</th><th class="n">Share of voice</th>
      </tr></thead><tbody>
    ${bi.map(x=>`<tr><td>${esc(x.kind)}</td><td class="n num">${n(x.answers)}</td>
      <td class="n num">${r1(x.mention_rate)}%</td>
      <td class="n num">${r1(x.citation_rate)}%</td>
      <td class="n num">${r1(x.sov)}%</td></tr>`).join('')}
    </tbody></table></div>`:'';

  const bd=a.brand_domains||[];
  const maxHits=Math.max(...bd.map(x=>Number(x.hits)||0),1);
  const domains=bd.length?`<h3>Which domain gets cited</h3>
    <p class="exp">When AI cites this brand, this is the property it sends people to.
    A spread across many domains is the fragmentation signal — the goal is to concentrate
    citations on the primary hub.</p>
    <div class="tw"><table><tbody>
    ${bd.map(x=>`<tr><td style="font-family:'IBM Plex Mono',monospace;font-size:12.5px">
      ${esc(x.domain)}${x.primary?' <span class="rpill hit">primary</span>':''}</td>
      <td style="width:55%"><span class="bt" style="width:min(320px,55vw)">
      <span class="bf" style="width:${(Number(x.hits)/maxHits*100).toFixed(1)}%;
      background:var(--indigo)"></span></span></td>
      <td class="n num"><b>${n(x.hits)}</b></td></tr>`).join('')}
    </tbody></table></div>`:'';

  const league=comp.length?`<h3>Competitor mentions</h3>
    <div class="tw"><table><thead><tr><th>Firm</th><th class="n">Mentions</th>
      </tr></thead><tbody>
    ${comp.slice(0,10).map(c=>`<tr><td>${esc(c.name)}</td>
      <td class="n num">${n(c.mentions)}</td></tr>`).join('')}
    </tbody></table></div>`:'';

  const sorted=pr.slice().sort((x,y)=>(y.cited-x.cited)||(y.mentioned-x.mentioned));
  const prompts=`<h3>Prompt-level detail</h3>
    <div class="tw"><table><thead><tr><th>Prompt</th><th class="n">Result</th>
      <th class="n">Share of voice</th></tr></thead><tbody>
    ${sorted.map(p=>{const c=Number(p.cited)||0,e=Number(p.engines)||0;
      const cls=c===0?'miss':(c>=e?'hit':'part');
      const txt=c===0?'absent':`${c}/${e} cited`;
      return `<tr><td>${esc(p.prompt)}${p.branded?
        ' <span class="rpill part">branded</span>':''}</td>
        <td class="n"><span class="rpill ${cls}">${txt}</span></td>
        <td class="n num">${r1(p.sov)}%</td></tr>`;
    }).join('')}</tbody></table></div>`;

  const meth=`<p class="meth"><b>Methodology.</b> Each prompt is sent to every configured
    engine; responses are parsed for brand mentions and source citations, normalised across
    platforms, and stored. Citation rate = answers citing a brand domain; mention rate =
    answers naming the brand; share of voice = brand mentions ÷ all tracked-brand mentions.
    Figures reflect live AI responses for the period shown.</p>`;

  return `<section>${head}${tiles}${callout}${engTable}${intent}${domains}${league}
    ${prompts}${meth}</section>` + promptManager();
}

function forms(f){
  const t=f.tiles||{},cov=f.coverage||{},df=f.delivery_failures||[],fl=f.flags||[];
  let html=`<section><p class="kick">Website Enquiries</p><h2>Form submissions</h2>
  <p class="exp">Every submission is checked automatically so junk never reaches you as a genuine
  enquiry. Filtered items are shown, not hidden.</p>
  <div class="tiles" style="margin-bottom:4px">
    ${tile('Valid leads',n(t.valid_leads))}${tile('Total submissions',n(t.total))}
    ${tile('Spam / filtered',n(t.filtered))}${tile('Needs review',n(t.needs_review))}</div>`;
  if(df.length){
    html+=`<h3>Worth knowing — delivery problems</h3><div class="pending" style="border-color:var(--orange)">
    ${df.map(x=>`<div><b>${esc(x.recipient)}</b> rejected ${n(x.messages)} notification${x.messages==1?'':'s'}
      between ${esc(x.first_seen)} and ${esc(x.last_seen)}. ${esc(x.reason||'')}</div>`).join('')}</div>`;
  }
  if(fl.length){
    html+=`<h3>Worth knowing — flagged submissions</h3><div class="pending" style="border-color:var(--magenta)">
    ${fl.map(x=>`<div><b>${esc(x.kind)}</b> — ${esc(x.name||x.email||'unnamed')} via ${esc(x.form||'')}: ${esc(x.why||'')}</div>`).join('')}</div>`;
  }
  html+=`<h3>Daily volume</h3>${barChart(f.daily,'valid','day')}`;
  const bf=f.by_form||[];
  if(bf.length){
    html+=`<h3>By form type</h3><div class="tw"><table><thead><tr><th>Form</th><th class="n">Total</th>
      <th class="n">Valid leads</th><th class="n">Needs review</th><th class="n">Spam / filtered</th>
      <th class="n">Not detailed</th></tr></thead><tbody>
      ${bf.map(r=>`<tr><td>${esc(r.form)}</td><td class="n num">${n(r.total)}</td>
        <td class="n num">${n(r.leads)}</td><td class="n num">${n(r.needs_review)}</td>
        <td class="n num">${n(r.filtered)}</td><td class="n num">${n(r.not_detailed)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  const subs=f.submissions||[];
  html+=`<h3>Every submission received</h3>
    <div class="tbar"><button class="xbtn" data-act="forms-xlsx"${subs.length?'':' disabled'}>
      Export submissions (.xlsx)</button>
      <span class="cnt">${n(subs.length)} in this period</span></div>
    ${isAdmin()?'':`<div class="pending" style="margin-bottom:12px">
      <b>How these are sorted.</b> Every submission is read and sorted into a genuine
      enquiry, a vendor approach, or something worth a second look. The export carries
      the full message text so any of it can be checked.</div>`}`;
  if(!subs.length)html+='<p class="exp">No submissions in this period.</p>';
  else html+=subs.map(s=>{
    const flds=s.fields?Object.entries(s.fields).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join(''):'';
    const cls={valid_lead:'good',needs_review:'info',needs_attention:'warn',suspicious:'warn',spam:'warn',test_submission:'info'}[s.class]||'info';
    return `<div class="sub"><div class="sub-h">
      <span>${esc(String(s.ts).replace('T',' ').slice(0,16))} · ${esc(s.form||'')}</span>
      <span class="badge ${cls}">${esc(String(s.class||'').replace(/_/g,' '))}</span></div>
      <div class="sub-c">${esc([s.name,s.email,s.phone].filter(Boolean).join(' · ')||'No contact details captured')}</div>
      <div class="sub-f">${flds||'<span style="color:var(--muted)">Content not retained for this submission.</span>'}</div></div>`;
  }).join('');
  if(cov.days_counts)html+=`<p class="exp" style="margin-top:14px"><span class="badge warn">Coverage note</span>
    Detailed message content is available for ${n(cov.days_full)} day${cov.days_full==1?'':'s'} in this
    window. ${n(cov.days_counts)} day${cov.days_counts==1?'':'s'} are counted but their content was not
    retained.</p>`;
  return html+'</section>'+reclassPanel();
}

function toxBand(t){
  const v=Number(t)||0;
  if(v>=80)return['severe','#c0392b'];
  if(v>=60)return['toxic','#c0392b'];
  if(v>=40)return['review','var(--orange)'];
  if(v>=20)return['low','var(--indigo)'];
  return['clean','var(--good)'];
}

// Grade colours follow the assessment rubric bands so a score reads the same
// here as it does in the PDF.
function bandColor(pct){
  if(pct>=80)return'#1a8a5a';
  if(pct>=70)return'var(--indigo)';
  if(pct>=60)return'var(--orange)';
  return'#c0392b';
}
function bandName(pct){
  if(pct>=90)return'Excellent';
  if(pct>=80)return'Strong';
  if(pct>=70)return'Good';
  if(pct>=60)return'Fair';
  return'Needs Improvement';
}
function donut(pct,color){
  const r=52,c=2*Math.PI*r,on=Math.max(0,Math.min(100,pct))/100*c;
  return `<svg viewBox="0 0 130 130" width="150" height="150" role="img"
    aria-label="score ${Math.round(pct)} out of 100">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--soft)" stroke-width="14"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${color}" stroke-width="14"
      stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${(c-on).toFixed(1)}"
      transform="rotate(-90 65 65)"/>
    <text x="65" y="63" text-anchor="middle" dominant-baseline="middle"
      font-family="Fraunces,Georgia,serif" font-weight="700" font-size="30"
      fill="var(--ink)">${Math.round(pct)}</text>
    <text x="65" y="84" text-anchor="middle" font-family="IBM Plex Mono,monospace"
      font-size="10" fill="var(--muted)">out of 100</text>
  </svg>`;
}

function readiness(d){
  const auds=S.audits||[];
  const TITLES={ai_visibility:'AI Visibility Assessment',
                agentic_browsing:'Agentic Browsing Readiness',
                entity_footprint:'AI Entity Footprint Review',
                seo_audit:'SEO Audit'};
  const CAT={machine_legibility:'Machine legibility',
    layout_stability:'Layout stability',ai_discovery_files:'AI discovery files',
    agent_actionability:'Agent actionability (WebMCP)',
    content_extractability:'Content & data extractability',
    agent_access:'Agent access & crawlability',
    technical_ai_readiness:'Technical AI readiness',structured_data:'Structured data',
    content_authority:'Content authority',ai_readability:'AI readability',
    entity_recognition:'Entity recognition',trust_eeat:'Trust & E-E-A-T',
    ai_search_visibility:'AI search visibility',
    competitive_position:'Competitive position'};

  if(!auds.length)return `<section><p class="kick">AI Search Practice</p>
    <h2>AI readiness</h2>
    <p class="exp">No audit has been published for this client yet. Scores appear here
    automatically the next time an AI Visibility Assessment or Agentic Browsing
    Readiness audit is run — nothing needs to be uploaded.</p></section>`;

  const blocks=auds.map(a=>{
    const max=Number(a.max_score)||100;
    const pct=Number(a.overall_score)/max*100;
    const col=bandColor(pct);
    const cats=(S.auditCats||{})[a.audit_type]||[];
    const prev=a.prev_score==null?null:Number(a.prev_score);
    const delta=prev==null?null:Number(a.overall_score)-prev;

    const trend=prev==null
      ? `<span class="flat">first run — no prior score to compare</span>`
      : `<span class="${delta>0?'up':delta<0?'dn':'flat'}">${
          delta>0?'▲ +':delta<0?'▼ ':''}${delta===0?'no change':Math.abs(delta)}</span>
         since ${esc(a.prev_date)}`;

    const rows=cats.map(c=>{
      const cp=Number(c.score)/(Number(c.max_score)||100)*100;
      return `<div class="catrow"><div class="nm">${esc(CAT[c.category]||c.category)}
        <div class="tk"><span class="fl" style="width:${cp.toFixed(1)}%;
          background:${bandColor(cp)}"></span></div>
        ${c.findings?`<div class="exp" style="margin-top:4px">${esc(c.findings)}</div>`:''}
        </div>
        <div class="sc" style="color:${bandColor(cp)}">${Math.round(Number(c.score))}</div>
      </div>`;}).join('');

    return `<div class="panel">
      <h3>${esc(TITLES[a.audit_type]||a.audit_type)}</h3>
      <div class="audmeta">Run ${esc(a.run_date)}${
        a.rubric_version?` · rubric ${esc(a.rubric_version)}`:''} · ${n(a.runs)} run${
        Number(a.runs)===1?'':'s'} recorded${
        a.url_audited?` · ${esc(a.url_audited)}`:''}</div>
      <div class="aud">
        <div class="donut">${donut(pct,col)}
          <div class="band" style="color:${col}">${esc(a.grade||bandName(pct))}</div>
          <div class="cap">${trend}</div>
        </div>
        <div>${rows||'<p class="exp">No category detail recorded for this run.</p>'}</div>
      </div>
      ${a.summary?`<p class="exp">${esc(a.summary)}</p>`:''}
      ${readinessTrend(a.audit_type)}
    </div>`;
  }).join('');

  return `<section><p class="kick">AI Search Practice</p><h2>AI readiness</h2>
    <p class="exp">Point-in-time rubric scores. Unlike the other tabs these do not move
    daily — a score changes when the site changes and the audit is re-run, which is what
    makes the run-to-run delta meaningful.</p>
    ${blocks}</section>`;
}

function backlinks(d){
  const b=d.backlinks;
  const tox=S.toxic||[];
  if(!b&&!tox.length)return `<section><p class="kick">Authority</p><h2>Backlink profile</h2>
    <div class="pending"><b>Not yet collected for this client.</b> The backlinks collector runs
    monthly across all clients for roughly $2 per full pass.</div></section>`;

  const prof=b?`<div class="tiles">${tile('Total backlinks',n(b.total_backlinks))}
    ${tile('Referring domains',n(b.referring_domains))}
    ${tile('Domain rank',n(b.domain_rank))}
    ${tile('Spam score',b.spam_score==null?'—':b.spam_score)}
    ${tile('Follow links',b.dofollow_pct==null?'—':b.dofollow_pct+'%')}</div>`:'';

  const bands={clean:0,low:0,review:0,toxic:0,severe:0};
  tox.forEach(r=>{bands[toxBand(r.toxicity)[0]]++});
  const flagged=tox.filter(r=>Number(r.toxicity)>=40);

  const dist=tox.length?`<h3>Toxicity distribution</h3>
    <p class="exp">Every domain is scored against a fixed rubric — spam score, anchor
    over-optimisation, sitewide placement, domain authority, link-farm topology, language and TLD.
    Each point traces to a named signal, shown per domain below.</p>
    <div class="tiles">
      ${tile('Clean',bands.clean,'under 20')}
      ${tile('Low',bands.low,'20–39')}
      ${tile('Review',bands.review,'40–59')}
      ${tile('Toxic',bands.toxic,'60–79')}
      ${tile('Severe',bands.severe,'80+')}
    </div>`:'';

  const vc={hi:0,lo:0,tox:0};
  tox.forEach(r=>{vc[linkValue(r).k]++});
  const table=tox.length?`<h3>Referring domains by value</h3>
    <div class="tiles">
      ${tile('High value',vc.hi,'clean, and from a strong domain')}
      ${tile('Low value',vc.lo,'safe, but carrying little authority')}
      ${tile('Toxic',vc.tox,'scoring 40+ — disavow candidates')}
    </div>
    <div class="tbar">
      <button class="xbtn" data-act="disavow"${vc.tox?'':' disabled'}>
        Export toxic links for Google Disavow (.txt)</button>
      <button class="xbtn" data-act="links-xlsx">Export all scored domains (.xlsx)</button>
      <span class="cnt">${n(tox.length)} domains scored</span>
    </div>
    <div class="tw"><table><thead><tr><th>Domain</th><th>Value</th><th class="n">Toxicity</th>
      <th class="n">Domain rank</th><th class="n">Links</th><th>Why it was flagged</th>
      <th>Status</th></tr></thead><tbody>
    ${tox.slice(0,60).map(r=>{const[lab,col]=toxBand(r.toxicity),v=linkValue(r);
      return `<tr><td>${esc(r.source_domain)}</td>
      <td><span class="vflag ${v.k}">${v.label}</span></td>
      <td class="n num" style="color:${col};font-weight:600">${Number(r.toxicity||0).toFixed(0)}</td>
      <td class="n num">${r.best_rank==null?'—':r.best_rank}</td>
      <td class="n num">${n(r.link_count)}</td>
      <td class="exp">${esc((r.reasons||[]).join(' · '))||'—'}</td>
      <td>${esc(r.disavow_status||'none')}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="exp" style="margin-top:11px"><b>High value</b> scores under 20 on the toxicity
    rubric and comes from a domain ranked 50 or above. <b>Toxic</b> is 40 or above and is what
    the disavow export contains. Everything else is <b>low value</b> — not harmful, just not
    doing much for the site.</p>`:'';

  const disavow=`<h3>Disavow</h3>
    <p class="exp">${flagged.length
      ? `<b>${flagged.length} domain${flagged.length===1?'':'s'}</b> scored at or above the review
         threshold of 40. A disavow file can be drafted from these for review.`
      : 'No domain currently scores at or above the review threshold of 40.'}</p>
    <div class="pending"><b>Nothing is ever submitted to Google automatically.</b>
    A disavow tells Google to discount links, and a file sent in error can reduce rankings.
    Candidates are drafted with their evidence and require sign-off before anyone files them.</div>`;

  return `<section><p class="kick">Authority</p><h2>Backlink profile</h2>
  <p class="exp">${b?`Profile as at ${esc(b.day)}.`:''} ${tox.length?`${n(tox.length)} referring
  domains scored.`:''}</p>
  ${prof}${dist}${table}${disavow}</section>`;
}

function render(){
  const d=S.data||{},f=S.forms||{};
  const v={overview:()=>overview(d,f),search:()=>search(d),
    rankings:()=>`<section><p class="kick">Rank Tracking</p>
      <h2>Rankings by search engine${intBadge}</h2>
      <p class="intnote">Working material. A client sees Front Page Placement on the Overview
      instead.</p>
      <p class="exp">Every tracked phrase, counted by where it sits on each engine.</p>
      ${engineTable(d)}</section>`,
    movement:()=>movement(d),traffic:()=>traffic(d),ai:()=>ai(d),
    readiness:()=>readiness(d),
    forms:()=>forms(f),backlinks:()=>backlinks(d),
    clients:()=>clientsTab()}[S.tab];
  $('body').innerHTML=v?v():'';
  const g=$('gensum'); if(g)g.onclick=genSummary;
  bindTab();
}

// Rendered markup is a string, so handlers are attached after each render rather
// than inlined — keeps the templates free of javascript: and onclick payloads.
function bindTab(){
  const body=$('body');
  (body.querySelectorAll('th[data-sort]')||[]).forEach(th=>th.onclick=()=>{
    const col=th.dataset.sort, cur=S.kwSort||{col:'best',dir:1};
    // First click on a new column sorts the way that column is usually read:
    // phrases A-Z, positions best-first.
    S.kwSort=cur.col===col?{col,dir:-cur.dir}:{col,dir:1};
    render();
  });
  const q=body.querySelector?body.querySelector('#kwq'):null;
  if(q){
    q.oninput=()=>{S.kwFilter=q.value;};
    // Re-render on a pause rather than on every keystroke, so 300 rows do not
    // redraw mid-word and steal the caret.
    let t=null;
    q.oninput=()=>{S.kwFilter=q.value; clearTimeout(t);
      t=setTimeout(()=>{render();const el=$('kwq');
        if(el&&el.focus){el.focus();if(el.setSelectionRange)
          el.setSelectionRange(el.value.length,el.value.length)}},260)};
  }
  (body.querySelectorAll('[data-act]')||[]).forEach(b=>b.onclick=()=>doAct(b.dataset.act));
  const cq=body.querySelector?body.querySelector('#cq'):null;
  if(cq){
    let ct=null;
    cq.oninput=()=>{S.cFilter=cq.value; clearTimeout(ct);
      ct=setTimeout(()=>{render();const el=$('cq');
        if(el&&el.focus){el.focus();if(el.setSelectionRange)
          el.setSelectionRange(el.value.length,el.value.length)}},260)};
  }
  const np=body.querySelector?body.querySelector('#pnew'):null;
  if(np)np.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doAct('prompt-add')}};
}

function doAct(act){
  // The placement measure is a view of data already loaded, so it re-renders
  // rather than re-reading.
  if(act==='place-page1'||act==='place-top3'){
    S.placeMetric=act.slice(6); render(); return }
  // Prompt actions talk to the API and re-render when they finish.
  if(act.indexOf('prompt-')===0){ doPromptAct(act); return }
  if(act.indexOf('client-')===0||act.indexOf('kw-add')===0
     ||act.indexOf('kw-remove')===0){ doClientAct(act); return }
  if(act.indexOf('reclass-')===0){ doReclass(act); return }
  const c=cliRow(), base=`${slug(c.name)}-${S.from}-to-${S.to}`;
  if(act==='pdf'){ window.print(); return }
  if(act==='kw-xlsx'){
    saveXlsx(kwExportRows(true),'Page one phrases',`${base}-page-one-phrases.xlsx`); return }
  if(act==='kw-all-xlsx'){
    saveXlsx(kwExportRows(false),'Tracked phrases',`${base}-tracked-phrases.xlsx`); return }
  if(act==='disavow'){ saveText(disavowText(),`${base}-disavow.txt`); return }
  if(act==='links-xlsx'){
    const rows=[['Referring domain','Value','Toxicity','Domain rank','Links',
                 'Why it was flagged','Disavow status']].concat(
      (S.toxic||[]).map(r=>[r.source_domain,linkValue(r).label,
        r.toxicity==null?'':Number(r.toxicity),r.best_rank==null?'':Number(r.best_rank),
        Number(r.link_count)||0,(r.reasons||[]).join(' · '),r.disavow_status||'none']));
    saveXlsx(rows,'Referring domains',`${base}-referring-domains.xlsx`); return }
  if(act==='forms-xlsx'){
    const subs=(S.forms||{}).submissions||[];
    // Field names vary per form, so the sheet gets one column per field actually
    // present, plus the whole payload verbatim so nothing is lost in flattening.
    const keys=[];
    subs.forEach(s=>Object.keys(s.fields||{}).forEach(k=>{if(keys.indexOf(k)<0)keys.push(k)}));
    const head=['Received','Form','Name','Email','Phone','Classification','Why',
                'Confidence','Delivered'].concat(keys).concat(['All fields']);
    const rows=[head].concat(subs.map(s=>{
      const f=s.fields||{};
      return [String(s.ts||'').replace('T',' ').slice(0,19),s.form||'',s.name||'',
        s.email||'',s.phone||'',String(s.class||'').replace(/_/g,' '),s.why||'',
        s.confidence==null?'':Number(s.confidence),
        s.delivered===false?'no':s.delivered===true?'yes':'']
        .concat(keys.map(k=>f[k]==null?'':String(f[k])))
        .concat([Object.entries(f).map(([k,v])=>k+': '+v).join('\n')]);
    }));
    saveXlsx(rows,'Form submissions',`${base}-form-submissions.xlsx`); return }
}

/* ---------- boot ---------- */
async function start(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  try{ S.role=sessionStorage.getItem('aim_role')==='client'?'client':'admin' }catch(_e){}
  chrome();
  try{
    S.clients=await api('/api/clients');
    if(!S.clients.length){$('body').innerHTML='<section><h2>No clients</h2></section>';return}
    $('client').innerHTML=S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    $('client').onchange=()=>{S.client=Number($('client').value);load()};
    S.client=S.clients[0].id;
    const w=windowFor(S.range); S.from=w.from; S.to=w.to;
    load();
  }catch(e){ if(e.message!=='unauthorized')$('body').innerHTML=`<section><h2>Could not start</h2><p class="exp">${esc(e.message)}</p></section>`; }
}
if(tok())start(); else showLogin('');
</script></body></html>
