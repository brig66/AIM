:root{
  --indigo:#352597;--magenta:#c0228a;--orange:#e7730d;
  --cream:#FFFAFB;--surface:#fff;--ink:#241d3d;--secondary:#4d4763;--muted:#6b647f;
  --line:#e8e2ee;--soft:#f7f3fa;--good:#2e8b57;--s1:#5343c9;--s2:#d96a0c;
  --shadow:0 1px 2px rgba(28,24,48,.05),0 6px 18px rgba(28,24,48,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --indigo:#8478e6;--magenta:#e05bac;--orange:#f0924a;--cream:#12101c;--surface:#1c1830;
  --ink:#fff;--secondary:#c9c3d8;--muted:#9a93ad;--line:#2f2a44;--soft:#241f38;
  --good:#3fa76b;--s1:#8478e6;--s2:#f0924a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);}}


/* ---- AI Readiness (point-in-time rubric audits) ---- */
.aud{display:grid;gap:16px;grid-template-columns:minmax(210px,240px) 1fr;
  align-items:start;margin-bottom:20px}
.donut{text-align:center}
.donut .cap{font-size:12px;color:var(--muted);margin-top:8px}
.donut .band{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:600;
  margin-top:2px}
.catrow{display:grid;grid-template-columns:1fr 62px;gap:10px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--soft)}
.catrow .nm{font-size:13.5px}
.catrow .tk{height:9px;background:var(--soft);border-radius:999px;overflow:hidden;
  margin-top:5px}
.catrow .fl{display:block;height:100%;border-radius:999px}
.catrow .sc{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:14px}
.audmeta{font-size:12px;color:var(--muted);margin-bottom:14px;
  font-family:"IBM Plex Mono",monospace}
@media(max-width:640px){.aud{grid-template-columns:1fr}}
/* ---- AI Visibility report styling (mirrors the AIM monitoring PDF) ---- */
.rhead{border:1px solid var(--line);border-radius:12px;overflow:hidden;
  margin-bottom:18px;background:var(--surface)}
.rhead .grad{height:8px;background:linear-gradient(90deg,var(--indigo),
  var(--magenta) 55%,var(--orange))}
.rhead .in{padding:18px 20px}
.rhead .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--magenta);
  font-weight:500;margin:0 0 6px}
.rhead h2{font-size:26px;margin:0 0 6px;color:var(--indigo)}
.rhead .meta{font-size:13px;color:var(--muted);margin:0;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.stats{display:grid;gap:12px;margin-bottom:18px;
  grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  background:var(--surface)}
.stat .v{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:34px;
  line-height:1;color:var(--magenta)}
.stat .v small{font-size:18px;margin-left:1px}
.stat .l{font-weight:600;font-size:13px;margin-top:6px}
.stat .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.callout{border-left:3px solid var(--magenta);background:var(--soft);
  padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:20px;
  font-size:13.5px;line-height:1.6}
.bt{display:inline-block;vertical-align:middle;width:min(190px,42vw);height:9px;
  background:var(--soft);border-radius:999px;overflow:hidden;margin-right:9px}
.bf{display:block;height:100%;border-radius:999px}
.rpill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;
  font-weight:600;white-space:nowrap}
.rpill.hit{background:#e6f4ee;color:#1a8a5a}
.rpill.part{background:#fdf0e3;color:#b45c09}
.rpill.miss{background:#fce9f3;color:var(--magenta)}
.meth{font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);
  padding-top:12px;margin-top:20px}
@media(max-width:640px){.rhead h2{font-size:21px}.stat .v{font-size:28px}
  .bt{width:88px}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 70px}
.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{max-width:1180px;margin:0 auto;padding:13px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.logo{height:36px}
.btxt{font-family:'Fraunces',Georgia,serif;font-size:14.5px;font-weight:600;color:var(--indigo);line-height:1.15}
.bkick{font-size:9.5px;color:var(--magenta);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:2px}
select,button{font-family:inherit}
.pick{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;max-width:230px}
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
.nav-in{max-width:1180px;margin:0 auto;padding:0 20px}
.tabs{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;border:0;border-bottom:2.5px solid transparent;background:none;cursor:pointer}
.tab:hover{color:var(--secondary)}
.tab.on{color:var(--indigo);border-bottom-color:var(--magenta)}
.ranges{display:flex;flex-wrap:wrap;gap:5px;padding:9px 0 10px;border-top:1px solid var(--soft);align-items:center}
.rg{padding:5px 11px;font-size:12px;font-weight:600;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--secondary);cursor:pointer}
.rg:hover{border-color:var(--indigo);color:var(--indigo)}
.rg.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.rg input{font:inherit;border:0;background:none;color:inherit;width:120px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:21px 23px;box-shadow:var(--shadow);margin-bottom:16px}
h2{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;color:var(--indigo);margin:0 0 3px}
.kick{font-size:10px;color:var(--magenta);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 11px}
.exp{font-size:13px;color:var(--muted);margin:0 0 15px;max-width:70ch}
h3{font-size:13.5px;font-weight:600;margin:18px 0 7px;color:var(--secondary)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
.t-lab{font-size:12px;font-weight:600;color:var(--secondary);margin-bottom:8px;line-height:1.35}
.t-val{font-family:'Fraunces',Georgia,serif;font-size:29px;font-weight:600;line-height:1;color:var(--indigo)}
.t-note{font-size:11px;color:var(--muted);margin-top:5px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:13.5px}
th,td{padding:9px 12px;border-bottom:1px solid var(--soft);text-align:left}
thead th{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{background:var(--soft);font-weight:600;border-top:2px solid var(--line)}
tr.total td:first-child{color:var(--indigo)}
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;border-bottom:1px solid var(--line);padding-top:6px;margin-bottom:6px;overflow-x:auto}
.col{flex:1;min-width:28px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.col .v{font-size:10px;font-weight:600;color:var(--secondary)}
.bar{width:100%;border-radius:3px 3px 0 0;background:var(--s1)}
.bar.part{background:repeating-linear-gradient(135deg,var(--orange) 0 5px,transparent 5px 10px),var(--surface);border:1.5px solid var(--orange);border-bottom:0}
.xax{display:flex;gap:5px;overflow-x:auto}
.xax span{flex:1;min-width:28px;text-align:center;font-size:10px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;font-size:12px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.badge.good{background:rgba(46,139,87,.13);color:var(--good)}
.badge.warn{background:rgba(231,115,13,.13);color:var(--orange)}
.badge.info{background:rgba(53,37,151,.1);color:var(--indigo)}
.pending{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;background:var(--soft);font-size:13px;color:var(--muted)}
.pending b{color:var(--secondary)}
.sub{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;break-inside:avoid}
.sub-h{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.sub-c{font-size:13.5px;font-weight:600;margin-bottom:7px}
.sub-f{font-size:13px;color:var(--secondary)}
.sub-f div{padding:2px 0}
.sub-f b{color:var(--ink);font-weight:600}
.hide{display:none}
#login{max-width:340px;margin:14vh auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow);text-align:center}
#login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:14px 0 10px;background:var(--cream);color:var(--ink)}
#login button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--indigo);color:#fff;font-weight:600;cursor:pointer}
.err{color:var(--magenta);font-size:13px;margin-top:10px;min-height:18px}
.foot{border-top:1px solid var(--line);margin-top:24px;padding-top:16px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.75}
.foot b{color:var(--secondary)}
.spin{text-align:center;padding:50px;color:var(--muted);font-size:14px}
@media(max-width:640px){.wrap{padding:0 13px 50px}section{padding:17px}.t-val{font-size:25px}}
/* ---- Overview report (mirrors the AIM client PDF deliverable) ---- */
/* Categorical marks need fixed hues, but they still have to survive the dark
   block, so they are tokens rather than literals baked into the SVG. */
:root{--c1:#352597;--c2:#c0228a;--c3:#e7730d;--c4:#5343c9;--c5:#d9569f;
  --c6:#f0924a;--c7:#1a8a5a;--c8:#8e8aa8;--bandbg:#352597}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --c1:#8478e6;--c2:#e05bac;--c3:#f0924a;--c4:#a79cf2;--c5:#ee8cc7;
  --c6:#f6b880;--c7:#3fa76b;--c8:#9a93ad;--bandbg:#4a3fa0}}
/* One fixed hue per search engine, used wherever an engine is a series rather
   than a row. Held apart from --c1..--c8 because those colour position bands
   and traffic channels, and an engine must not change colour when the number of
   channels does. Both sets are checked for colour-blind separation and for
   contrast against the card they sit on, per mode -- the dark steps are chosen,
   not lightened copies. */
:root{--e1:#4a3ab8;--e2:#c0228a;--e3:#e7730d;--e4:#3d95ec}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --e1:#886bee;--e2:#df539f;--e3:#e16900;--e4:#00a1dc}}

.ovhead{border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow);margin-bottom:20px}
.ovhead .grad{height:10px;
  background:linear-gradient(90deg,var(--indigo),var(--magenta) 55%,var(--orange))}
.ovhead .in{padding:22px 24px}
.ovhead .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--magenta);font-weight:500;
  margin:0 0 8px}
.ovhead h1{font-family:'Fraunces',Georgia,serif;font-size:31px;font-weight:600;
  color:var(--indigo);margin:0 0 4px;line-height:1.12}
.ovhead .dom{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;
  color:var(--muted);margin:0 0 12px}
.ovhead .range{font-size:13.5px;color:var(--secondary);margin:0 0 14px}
.ovhead .range b{color:var(--ink)}
.srcs{display:flex;flex-wrap:wrap;gap:7px}
.srcchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  border-radius:999px;padding:4px 12px;font-size:11.5px;color:var(--secondary);
  background:var(--cream)}
.srcchip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.srcchip.on .dot{background:var(--good)}
.srcchip.bad .dot{background:var(--orange)}

.rband{background:var(--bandbg);border-radius:9px;padding:11px 18px;margin:26px 0 14px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.rband h3{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;color:#fff;
  margin:0}
.rband .bn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.74)}

/* AI executive summary */
.sumblk{margin-bottom:20px}
.sumblk h4{font-family:'Fraunces',Georgia,serif;font-size:16.5px;font-weight:600;
  color:var(--indigo);margin:0 0 8px}
.sumblk p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--secondary)}
.sumpts{list-style:none;margin:0;padding:0}
.sumpts li{padding:8px 0 8px 15px;border-left:2px solid var(--magenta);margin-bottom:4px;
  font-size:13.5px;line-height:1.65;color:var(--secondary)}
.sumpts li b{color:var(--ink)}
.nextl{margin:0;padding-left:20px}
.nextl li{font-size:13.5px;line-height:1.65;color:var(--secondary);margin-bottom:8px}
.sumcap{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  color:var(--muted);border-top:1px solid var(--line);padding-top:11px;line-height:1.7}
.genbtn{padding:9px 17px;border:0;border-radius:8px;background:var(--indigo);color:#fff;
  font-weight:600;font-size:13.5px;cursor:pointer;margin-top:11px}
.genbtn[disabled]{opacity:.55;cursor:default}

/* Channel donuts */
/* 380px keeps this to two columns on a laptop, so four measures read as a 2x2
   block and channel names in the legend are not truncated. */
.dnuts{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.dcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);
  padding:15px 17px;box-shadow:var(--shadow)}
.dcard>.h{font-weight:600;font-size:13.5px}
.dcard>.n{font-size:11.5px;color:var(--muted);margin:3px 0 11px;line-height:1.45}
.dbody{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center}
.dleg{display:flex;flex-direction:column;gap:5px;min-width:0}
.dleg .row{display:grid;grid-template-columns:10px minmax(0,1fr) auto 46px;gap:8px;
  align-items:center;font-size:12px}
.dleg .sw2{width:10px;height:10px;border-radius:3px}
.dleg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--secondary)}
.dleg .vv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;
  font-variant-numeric:tabular-nums}
.dleg .pp{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--muted);
  text-align:right;font-variant-numeric:tabular-nums}

/* Stacked placement bars */
.stk{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.stkrow{display:grid;grid-template-columns:136px minmax(0,1fr);gap:13px;align-items:center}
.stkrow .lb{font-size:12.5px;font-weight:600;color:var(--secondary)}
.stkbar{display:flex;height:23px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stkbar span{display:block;height:100%;overflow:hidden}
.stkbar em{font-style:normal;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;color:#fff;line-height:23px;padding:0 7px;white-space:nowrap}

/* Placement over time: one chart, one line per engine */
.mvhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  justify-content:space-between;margin:22px 0 4px}
.mvhead .t{font-family:'Fraunces',Georgia,serif;font-size:15.5px;font-weight:600;
  color:var(--indigo);margin:0}
.mvhead .n{font-size:11.5px;color:var(--muted);margin:3px 0 0;line-height:1.45}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:6px 13px;font:inherit;font-size:12px;
  color:var(--secondary);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--indigo);color:#fff;font-weight:600}
.lnwrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);
  box-shadow:var(--shadow);padding:14px 16px 10px;overflow-x:auto}
.lnchart{display:block;width:100%;min-width:680px;height:auto}
/* The crosshair and its readout are invisible until the band is hovered, and
   never hit-testable: an opacity-0 element still catches the pointer, and the
   readout spans the whole plot, so without this it would swallow hovers meant
   for other buckets. */
.lnchart .cx,.lnchart .rdt{opacity:0;pointer-events:none}
.lnchart .bnd:hover .cx{opacity:.5}
.lnchart .bnd:hover .rdt{opacity:1}
.mvtab{margin-top:13px}
.mvtab summary{font-size:12.5px;color:var(--secondary);cursor:pointer}
.mvtab summary:hover{color:var(--indigo)}
.mvtab .tw{margin-top:9px}
.mvleg{display:grid;gap:8px;margin-top:13px;
  grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.mvleg .row{display:flex;gap:8px;align-items:baseline;font-size:12.5px;min-width:0}
.mvleg .sw2{width:11px;height:11px;border-radius:3px;transform:translateY(1px)}
.mvleg .nm{color:var(--secondary);font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mvleg .vv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
  color:var(--ink);font-weight:600}
.mvleg .dd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  font-variant-numeric:tabular-nums;margin-left:6px}
.mvleg .dd.up{color:var(--good)}
.mvleg .dd.down{color:var(--orange)}
.mvleg .dd.flat{color:var(--muted)}
.stat .mv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  font-variant-numeric:tabular-nums;margin-top:5px}
.stat .mv.up{color:var(--good)}
.stat .mv.down{color:var(--orange)}
.stat .mv.flat{color:var(--muted)}

/* Sitewide vs organic */
.split{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(262px,1fr))}
.pcol{border:1px solid var(--line);border-radius:12px;background:var(--surface);
  padding:16px 18px;box-shadow:var(--shadow)}
.pcol>.h{font-family:'Fraunces',Georgia,serif;font-size:15.5px;font-weight:600;
  color:var(--indigo);margin:0 0 3px}
.pcol>.n{font-size:11.5px;color:var(--muted);margin:0 0 13px;line-height:1.45}
.pmet{display:flex;gap:17px;flex-wrap:wrap}
.pmet .m{flex:1;min-width:106px}
.pmet .mv{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;line-height:1}
.pmet .ml{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}

.ncl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ncl span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;
  background:var(--surface);color:var(--muted)}

@media(max-width:640px){
  .ovhead .in{padding:17px}.ovhead h1{font-size:24px}
  .rband{padding:10px 14px}.rband h3{font-size:15.5px}
  .dbody{grid-template-columns:1fr;justify-items:center}
  .dleg{width:100%}
  .stkrow{grid-template-columns:1fr;gap:5px}
  .pmet .mv{font-size:26px}
}
/* ---- Sortable / filterable tables, export controls ---- */
.tbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:6px 0 11px}
.filt{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:13px;min-width:210px;flex:1;max-width:340px}
.xbtn{padding:7px 13px;border:1px solid var(--indigo);border-radius:8px;background:var(--surface);
  color:var(--indigo);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.xbtn:hover{background:var(--indigo);color:#fff}
.xbtn[disabled]{opacity:.45;cursor:default;border-color:var(--line);color:var(--muted);
  background:var(--surface)}
.cnt{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace}
th[data-sort]{cursor:pointer;user-select:none;white-space:nowrap}
th[data-sort]:hover{color:var(--indigo)}
th[data-sort] .ar{opacity:.32;margin-left:3px;font-size:9px}
th[data-sort].on{color:var(--indigo)}
th[data-sort].on .ar{opacity:1}
.matrix td.p{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
.pos{display:inline-block;min-width:30px;padding:1px 7px;border-radius:5px;font-weight:600;
  font-size:12px}
.pos.t3{background:rgba(26,138,90,.14);color:#1a8a5a}
.pos.p1{background:rgba(53,37,151,.11);color:var(--indigo)}
.pos.p2{background:rgba(231,115,13,.14);color:#b45c09}
.pos.nr{color:var(--muted)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pos.t3{color:#4cc48a}
  :root:not([data-theme=light]) .pos.p1{color:#a79cf2}
  :root:not([data-theme=light]) .pos.p2{color:#f0a95e}}

/* ---- Link value flags ---- */
.vflag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:600;
  white-space:nowrap}
.vflag.hi{background:rgba(26,138,90,.14);color:#1a8a5a}
.vflag.lo{background:var(--soft);color:var(--muted)}
.vflag.tox{background:rgba(192,57,43,.13);color:#c0392b}

/* ---- Bot vs human estimate ---- */
.botbar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--soft);
  margin:4px 0 10px}
.botbar span{display:block;height:100%;overflow:hidden}
.botbar em{font-style:normal;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  color:#fff;line-height:26px;padding:0 8px;white-space:nowrap}
.risk{display:inline-block;min-width:26px;text-align:right;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600}

/* ---- Readiness trend ---- */
.trend{display:flex;align-items:flex-end;gap:7px;height:74px;padding-top:4px;
  border-bottom:1px solid var(--line);margin-bottom:5px}
.trend .tb{flex:1;min-width:16px;max-width:52px;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;gap:3px;height:100%}
.trend .tv{font-size:10px;font-weight:600;font-family:"IBM Plex Mono",ui-monospace,monospace}
.trend .tf{width:100%;border-radius:3px 3px 0 0}
.trendx{display:flex;gap:7px}
.trendx span{flex:1;min-width:16px;max-width:52px;text-align:center;font-size:9.5px;
  color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---- Print: the Overview becomes the AIM PDF deliverable ---- */
@media print{
  /* Restate the light palette: a viewer in dark mode must still print a light
     document, and the browser will not flip these back on its own.
     The dark palette is declared on :root:not([data-theme=light]), which
     outranks a bare :root whatever the order, so this has to match that
     specificity or a dark-mode viewer prints a dark PDF. */
  :root,:root:not([data-theme=light]){
    --cream:#fff;--surface:#fff;--ink:#241d3d;--secondary:#4d4763;--muted:#6b647f;
    --line:#ddd6e6;--soft:#f4f0f8;--indigo:#352597;--magenta:#c0228a;--orange:#e7730d;
    --good:#2e8b57;--c1:#352597;--c2:#c0228a;--c3:#e7730d;--c4:#5343c9;--c5:#d9569f;
    --c6:#f0924a;--c7:#1a8a5a;--c8:#8e8aa8;--bandbg:#352597;--shadow:none;
    --e1:#4a3ab8;--e2:#c0228a;--e3:#e7730d;--e4:#3d95ec}
  @page{margin:12mm 11mm}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  html,body{background:#fff !important}
  .nav,.mast,.ranges,.tabs,.genbtn,.xbtn,.tbar,#out,.pdfbar{display:none !important}
  .wrap{max-width:none;padding:0}
  section{border:1px solid var(--line);box-shadow:none;break-inside:avoid;
    page-break-inside:avoid;margin-bottom:11px;padding:15px 17px}
  .ovhead{break-inside:avoid;page-break-inside:avoid}
  .rband{break-after:avoid;page-break-after:avoid;break-inside:avoid}
  .dcard,.pcol,.stat,.tile,.sub{break-inside:avoid;page-break-inside:avoid}
  /* The measure toggle and the table are on-screen controls; the printed page
     carries whichever measure was chosen, and its heading names it. */
  .seg,.mvtab{display:none !important}
  .mvhead{break-after:avoid;page-break-after:avoid}
  .lnwrap{overflow:visible;break-inside:avoid;page-break-inside:avoid}
  .lnchart{min-width:0}
  .dnuts{grid-template-columns:1fr 1fr}
  .foot{break-inside:avoid;page-break-inside:avoid}
  a[href]:after{content:""}
  .prfoot{display:block !important}
}
.prfoot{display:none}
.pdfbar{display:flex;justify-content:flex-end;margin-bottom:12px}

/* ---- Internal-only content ---- */
.rolebar{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rolebar button{padding:6px 11px;border:0;background:var(--surface);color:var(--muted);
  font-size:12px;font-weight:600;cursor:pointer}
.rolebar button.on{background:var(--indigo);color:#fff}
.intbadge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(231,115,13,.14);
  color:#b45c09;vertical-align:middle;margin-left:9px}
.intnote{font-size:11.5px;color:var(--muted);margin:-4px 0 12px}
@media print{.rolebar,.intbadge{display:none !important}}

/* ---- Tracked question management (AIM only) ---- */
.plist{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:11px;align-items:center;
  padding:10px 13px;border-bottom:1px solid var(--soft);font-size:13.5px}
.prow:last-child{border-bottom:0}
.prow:nth-child(even){background:var(--soft)}
.prow.off .ptxt{color:var(--muted);text-decoration:line-through}
.ptxt{min-width:0;word-break:break-word}
.pmeta{font-size:11px;color:var(--muted);margin-top:3px;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.pbtn{padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);
  color:var(--secondary);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.pbtn:hover{border-color:var(--indigo);color:var(--indigo)}
.pbtn.danger:hover{border-color:var(--magenta);color:var(--magenta)}
.pbtn[disabled]{opacity:.45;cursor:default}
.paddbox{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.paddbox input{flex:1;min-width:240px;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.perr{color:var(--magenta);font-size:12.5px;margin-top:9px;min-height:16px}
@media(max-width:640px){.prow{grid-template-columns:1fr;gap:7px}}

/* ---- Clients tab (AIM only) ---- */
.clist{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.crow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
  padding:13px 15px;border-bottom:1px solid var(--soft)}
.crow:last-of-type{border-bottom:0}
.crow.off{background:var(--soft)}
.cname{font-weight:600;font-size:14.5px}
.cmeta{font-size:11.5px;color:var(--muted);margin-top:2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  border-radius:999px;padding:2px 10px;font-size:11px;color:var(--muted);
  background:var(--surface)}
.cchip:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.cchip.on{color:var(--secondary)}
.cchip.on:before{background:var(--good)}
.cwarn{font-size:11.5px;color:#b45c09;margin-top:7px}
.cacts{display:flex;gap:7px;flex-wrap:wrap}
.cform{border:1px solid var(--indigo);border-top:0;border-radius:0 0 10px 10px;
  padding:15px 17px;background:var(--soft);margin:-1px 0 10px}
.cgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  margin-bottom:12px}
.cform label,.cfull{display:block;font-size:12px;font-weight:600;color:var(--secondary)}
.cform input,.cform textarea{width:100%;margin-top:5px;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;
  background:var(--surface);color:var(--ink)}
.cform textarea{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;
  line-height:1.55;resize:vertical}
.cform .pick{width:100%;margin-top:5px;max-width:none}
.chelp{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:5px;
  line-height:1.5}
.cfull{margin-bottom:12px}
.crh{font-size:12.5px;font-weight:600;color:var(--secondary);margin:14px 0 7px}
.cerr{font-size:12.5px;color:var(--magenta);min-height:16px;margin:9px 0}
.cok{font-size:12.5px;color:var(--good);min-height:0;margin:0 0 9px;font-weight:600}
@media(max-width:640px){.crow{grid-template-columns:1fr}.cgrid{grid-template-columns:1fr}}
</style></head><body>

<script>
const API='https://hfmvugxpwgagvxsjbjfn.supabase.co/functions/v1/dashboard';
// The summary generator is its own edge function alongside the data API.
const ASK=API.replace(/\/dashboard$/,'/ask');
const STORE='aim_session';
const S={toxic:[],aiFull:null,audits:[],auditCats:{},clients:[],client:null,tab:'overview',
  range:'30d',from:null,to:null,data:null,forms:null,busy:false,
  trafficTotals:null,summary:null,summaryState:'idle',summaryErr:null,summaryCache:{},
  trafficDaily:null,tech:null,kw:null,kwSort:{col:'best',dir:1},kwFilter:'',auditHist:{},
  rankMove:null,placeMetric:'page1',
  role:'admin',prompts:null,promptBusy:null,promptErr:'',
  cAdmin:null,cEdit:null,cKw:null,cNew:false,cBusy:null,cErr:'',cFilter:'',
  cRecent:null,cLoc:'',cDraft:null,cNewDraft:null,cMsg:'',
  reclass:null,reclassBusy:null,reclassErr:''};

const TABS=[['overview','Overview'],['search','Search'],['rankings','Rankings'],['movement','Movement'],
            ['traffic','Traffic'],['ai','AI Visibility'],['readiness','AI Readiness'],
            ['forms','Forms'],['backlinks','Backlinks'],['clients','Clients']];
const RANGES=[['7d','Week'],['30d','30 days'],['60d','60 days'],['90d','90 days'],
              ['6m','6 months'],['12m','12 months'],['py','Prior year']];

/* ---------- who is looking ----------
   'admin' is AIM; 'client' is the view a client is meant to see. Some of this
   dashboard is working material — the automation estimate reads as an accusation
   about a client's own traffic, and the rank matrix is our worksheet, not their
   report.

   IMPORTANT: this is a presentation filter, not access control. Every login
   still receives the same token and the API still answers for any client id it
   is asked about. It stops internal material appearing on screen in a client
   meeting or in an exported PDF. It would NOT stop a client with a login from
   reading the same data directly, so before real client logins ship the role
   has to come from the signed token and the API has to scope by client. */
const INTERNAL_TABS=['rankings','clients'];
const isAdmin=()=>S.role!=='client';
// Marks a heading as internal so it is obvious on screen what a client is not
// seeing. Hidden in print, because an exported PDF has no internal sections.
const intBadge='<span class="intbadge">AIM only</span>';

const $=id=>document.getElementById(id);
const tok=()=>sessionStorage.getItem(STORE);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'—':Number(v).toLocaleString();
const pct=v=>v==null?'—':Number(v).toFixed(1)+'%';

function iso(d){return d.toISOString().slice(0,10)}
function windowFor(r){
  const to=new Date(); let from=new Date();
  if(r==='7d')from.setDate(to.getDate()-7);
  else if(r==='30d')from.setDate(to.getDate()-30);
  else if(r==='60d')from.setDate(to.getDate()-60);
  else if(r==='90d')from.setDate(to.getDate()-90);
  else if(r==='6m')from.setMonth(to.getMonth()-6);
  else if(r==='12m')from.setMonth(to.getMonth()-12);
  else if(r==='py'){return{from:(to.getFullYear()-1)+'-01-01',to:(to.getFullYear()-1)+'-12-31'}}
  return {from:iso(from),to:iso(to)};
}

/* ---------- auth ---------- */
function showLogin(m){$('login').classList.remove('hide');$('app').classList.add('hide');$('lerr').textContent=m||''}
$('lf').addEventListener('submit',async e=>{
  e.preventDefault(); $('lerr').textContent='Checking…';
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:$('pw').value})});
    if(r.status===401){$('lerr').textContent="That password wasn't right.";return}
    if(!r.ok)throw new Error('Sign-in failed');
    const d=await r.json(); sessionStorage.setItem(STORE,d.token); start();
  }catch(err){$('lerr').textContent=err.message}
});
$('out').addEventListener('click',()=>{sessionStorage.removeItem(STORE);showLogin('')});

async function api(path){
  const r=await fetch(API+path,{headers:{'x-aim-session':tok()||''}});
  if(r.status===401){sessionStorage.removeItem(STORE);showLogin('Session expired — sign in again.');throw new Error('unauthorized')}
  if(!r.ok)throw new Error('Request failed ('+r.status+')');
  return r.json();
}

// ask is a separate function from dashboard, with its own copy of the token
// check, and the two have already drifted apart once: ask kept reading the
// pre-role two-part token after dashboard started minting three-part ones, so
// every summary rejected a login that was perfectly good. A 401 from one
// service is not evidence the other has expired, so confirm against the
// dashboard API before throwing the session away. Network trouble is not an
// auth failure and must not sign anyone out either.
async function sessionAlive(){
  try{
    const r=await fetch(API+'/api/clients',{headers:{'x-aim-session':tok()||''}});
    return r.status!==401;
  }catch(_e){ return true; }
}

// Writes are POST and admin-only at the API. The page still guards on role so a
// client view never renders the controls, but the API is the boundary that
// matters — this check is for tidiness, not security.
async function apiPost(path,body){
  const r=await fetch(API+path,{method:'POST',
    headers:{'Content-Type':'application/json','x-aim-session':tok()||''},
    body:JSON.stringify(body||{})});
  if(r.status===401){sessionStorage.removeItem(STORE);
    showLogin('Session expired — sign in again.');throw new Error('unauthorized')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    // The RPCs raise a named error plus a plain-English hint; prefer the hint.
    throw new Error(j.detail||PROMPT_ERR[j.error]||j.error||`Request failed (${r.status})`);
  }
  return j;
}
const PROMPT_ERR={
  prompt_too_short:'That phrase is too short to track.',
  prompt_too_long:'That phrase is too long — keep it under 500 characters.',
  duplicate_prompt:'That phrase is already being tracked for this client.',
  // Kept as a safety net: the set is now created on demand, so this should no
  // longer be reachable from the Add button.
  no_prompt_set:'This client has no AI prompt set yet, so there is nothing to add to.',
  prompt_not_found:'That phrase no longer exists.',
  forbidden:'Adding and removing phrases is limited to the AIM login.'};

/* ---------- chrome ---------- */
function chrome(){
  const tabs=TABS.filter(([k])=>isAdmin()||INTERNAL_TABS.indexOf(k)<0);
  // Switching to client view while standing on an internal tab must not leave a
  // blank page.
  if(tabs.every(([k])=>k!==S.tab))S.tab=tabs[0][0];
  $('tabs').innerHTML=tabs.map(([k,l])=>
    `<button class="tab${S.tab===k?' on':''}" data-t="${k}">${l}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;chrome();render()});
  $('rolebar').innerHTML=
    `<button data-role="admin" class="${isAdmin()?'on':''}">Full view</button>
     <button data-role="client" class="${isAdmin()?'':'on'}">Client view</button>`;
  $('rolebar').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    S.role=b.dataset.role;
    // Survives tab switches within the session; never persisted beyond it.
    try{sessionStorage.setItem('aim_role',S.role)}catch(_e){}
    chrome(); render();
  });
  $('ranges').innerHTML=RANGES.map(([k,l])=>
    `<button class="rg${S.range===k?' on':''}" data-r="${k}">${l}</button>`).join('')
    +`<span class="rg" style="border-style:dashed">From <input type="date" id="cf" value="${S.from||''}">
      to <input type="date" id="ct" value="${S.to||''}"></span>`;
  $('ranges').querySelectorAll('.rg[data-r]').forEach(b=>b.onclick=()=>{
    S.range=b.dataset.r; const w=windowFor(b.dataset.r); S.from=w.from; S.to=w.to; load();});
  const cf=$('cf'),ct=$('ct');
  const custom=()=>{if(cf.value&&ct.value){S.range='custom';S.from=cf.value;S.to=ct.value;load()}};
  cf.onchange=custom; ct.onchange=custom;
}

/* ---------- data ---------- */
async function load(){
  if(S.busy||!S.client)return; S.busy=true;
  $('body').innerHTML='<div class="spin">Loading…</div>';
  try{
    const q=`?client=${S.client}&from=${S.from}&to=${S.to}&limit=200`;
    // Placement over time rebuilds a snapshot of every tracked phrase at the end
    // of every bucket, which makes it the slowest read on the page. Started here
    // and awaited at the bottom, it runs alongside the other reads and costs no
    // extra wall clock. null means it did not answer, which the section says
    // rather than drawing a flat line.
    const movePromise=api(`/api/rank_movement?client=${S.client}&from=${S.from}&to=${S.to}`)
      .then(r=>r||null).catch(()=>null);
    S.forms=await api('/api/forms'+q);
    S.data=S.forms.report||{};
    // Toxicity is a separate read: it is link-level and not date-scoped,
    // so it does not belong in the period-bounded report bundle.
    try{
      S.toxic=await api(`/api/backlinks_toxic?client=${S.client}&limit=60`);
    }catch(_e){ S.toxic=[]; }
    // dash_ai carries the full monitoring payload (per-engine, per-prompt,
    // competitors, domains) that the bundled report summarises down to 4 rows.
    try{ S.aiFull=await api(`/api/ai?client=${S.client}&from=${S.from}&to=${S.to}`); }
    catch(_e){ S.aiFull=null; }
    // Audits are point-in-time, not period-bounded: always fetch the latest
    // run regardless of the date range, then load its categories.
    try{
      S.audits=await api(`/api/audits?client=${S.client}`)||[];
      S.auditCats={};
      for(const a of S.audits){
        S.auditCats[a.audit_type]=await api(`/api/audit_scores?run=${a.run_id}`)||[];
      }
    }catch(_e){ S.audits=[]; S.auditCats={}; }
    // Bounce rate lives on the traffic-totals RPC rather than the report bundle.
    // null means the endpoint did not answer, which is not the same as no visits.
    try{ S.trafficTotals=await api(`/api/traffic_totals?client=${S.client}&from=${S.from}&to=${S.to}`)||[]; }
    catch(_e){ S.trafficTotals=null; }
    // Per-day traffic carries new_users, and the tech read carries the country /
    // duration signals the automation estimate is built from. Both are optional:
    // null means the endpoint did not answer, which is not the same as zero.
    try{ S.trafficDaily=await api(`/api/traffic?client=${S.client}&from=${S.from}&to=${S.to}`)||[]; }
    catch(_e){ S.trafficDaily=null; }
    try{ S.tech=await api(`/api/traffic_tech?client=${S.client}&from=${S.from}&to=${S.to}`)||[]; }
    catch(_e){ S.tech=null; }
    // The rank matrix is one read per engine; a single engine failing must not
    // blank the whole table, so each falls back to an empty list.
    try{
      const sets=await Promise.all(ENG_ORDER.map(e=>
        api(`/api/keywords?client=${S.client}&engine=${e}&from=${S.from}&to=${S.to}`)
          .then(r=>r||[]).catch(()=>[])));
      S.kw=sets.some(s=>s.length)?mergeKeywords(ENG_ORDER,sets):[];
    }catch(_e){ S.kw=null; }
    // Audit history drives the readiness trend; only fetched for types that exist.
    S.auditHist={};
    for(const a of (S.audits||[])){
      try{ S.auditHist[a.audit_type]=await api(
        `/api/audit_history?client=${S.client}&type=${encodeURIComponent(a.audit_type)}`)||[]; }
      catch(_e){ S.auditHist[a.audit_type]=[]; }
    }
    // The tracked question set. Only AIM can change it, but the read is
    // harmless, so it loads either way and the controls are what is gated.
    try{ S.prompts=await api(`/api/prompts?client=${S.client}`)||[]; }
    catch(_e){ S.prompts=null; }
    S.promptErr=''; S.promptBusy=null;
    // Client administration list. Read once per load; a write re-reads it.
    if(isAdmin()){
      try{ S.cAdmin=await api('/api/clients_admin')||[]; }catch(_e){ S.cAdmin=null; }
    }
    S.cErr=''; S.cBusy=null;
    S.rankMove=await movePromise;
    await loadSummary();
    S.data.aiFull=S.aiFull;
    $('genline').textContent=`Reporting ${S.from} to ${S.to} · generated ${iso(new Date())}`;
    render();
  }catch(e){ if(e.message!=='unauthorized')$('body').innerHTML=`<section><h2>Could not load</h2><p class="exp">${esc(e.message)}</p></section>`; }
  finally{S.busy=false}
}

// The cached summary is read separately and must never break the tab: the route
// is an allowlist entry that may not be deployed yet, and a client with no cached
// row is the normal case, not an error.
async function loadSummary(){
  const key=sumKey();
  S.summary=null; S.summaryErr=null; S.summaryState='idle';
  if(S.summaryCache[key]){S.summary=S.summaryCache[key];S.summaryState='ready';return}
  try{
    const r=await api(`/api/summary?client=${S.client}&from=${S.from}&to=${S.to}`);
    const row=Array.isArray(r)?r[0]:r;   // dash_summary returns a set, so 0 or 1 rows
    if(row&&row.summary){
      S.summary=Object.assign({},row,
        {next_steps:row.next_steps||row.next||[],points:row.points||[],cached:true});
      S.summaryCache[key]=S.summary; S.summaryState='ready';
    }
  }catch(_e){ /* not deployed, or nothing cached: fall through to the button */ }
}

/* ---------- file exports ----------
   A real .xlsx rather than CSV: message bodies carry commas, quotes and line
   breaks, and Excel's CSV import mangles phone numbers and leading zeros. An
   xlsx is a zip of XML parts; storing the entries uncompressed keeps this to a
   CRC32 and two headers per file instead of a deflate implementation. */

const CRC_T=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0}
  return t})();
function crc32(u8){let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0}

// XML 1.0 forbids most control characters outright, so they are dropped rather
// than escaped — Excel refuses to open a file that contains them.
const xesc=s=>String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'')
  .replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));

function colName(i){let s='',x=i+1;while(x>0){const m=(x-1)%26;s=String.fromCharCode(65+m)+s;
  x=(x-m-1)/26}return s}

function sheetXml(rows){
  const body=rows.map((row,r)=>{
    const cells=row.map((v,c)=>{
      const ref=colName(c)+(r+1);
      if(v==null||v==='')return `<c r="${ref}"/>`;
      if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r+1}">${cells}</row>`;
  }).join('');
  const cols=(rows[0]||[]).map((_,i)=>
    `<col min="${i+1}" max="${i+1}" width="${i===0?46:17}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${cols}</cols><sheetData>${body}</sheetData></worksheet>`;
}

function zipBytes(files){
  const enc=new TextEncoder();
  const u16=v=>[v&255,(v>>8)&255];
  const u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const parts=[],dir=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=f.data,crc=crc32(data),n=data.length;
    const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(crc),...u32(n),...u32(n),...u16(name.length),...u16(0)]);
    parts.push(local,name,data);
    dir.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(crc),...u32(n),...u32(n),...u16(name.length),
      ...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=local.length+name.length+n;
  }
  const dirSize=dir.reduce((a,p)=>a+p.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(files.length),...u16(files.length),...u32(dirSize),...u32(off),...u16(0)]);
  const all=[...parts,...dir,end];
  const total=all.reduce((a,p)=>a+p.length,0);
  const out=new Uint8Array(total); let at=0;
  for(const p of all){out.set(p,at);at+=p.length}
  return out;
}

function xlsx(rows,sheetName){
  const enc=new TextEncoder(),E=s=>enc.encode(s);
  const nm=xesc(String(sheetName||'Sheet1').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31));
  return zipBytes([
    {name:'[Content_Types].xml',data:E(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`)},
    {name:'_rels/.rels',data:E(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)},
    {name:'xl/workbook.xml',data:E(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="${nm}" sheetId="1" r:id="rId1"/></sheets></workbook>`)},
    {name:'xl/_rels/workbook.xml.rels',data:E(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`)},
    {name:'xl/worksheets/sheet1.xml',data:E(sheetXml(rows))},
  ]);
}

function saveBlob(data,mime,filename){
  const blob=new Blob([data],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  // Revoking immediately can cancel the download in some browsers.
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},2000);
}
const slug=s=>String(s||'client').toLowerCase().replace(/[^a-z0-9]+/g,'-')
  .replace(/^-|-$/g,'').slice(0,40)||'client';
function saveXlsx(rows,sheetName,filename){
  saveBlob(xlsx(rows,sheetName),
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',filename);
}
function saveText(text,filename){saveBlob(text,'text/plain;charset=utf-8',filename);}

/* ---------- renderers ---------- */
function tile(lab,val,note){return `<div class="tile"><div class="t-lab">${lab}</div>
  <div class="t-val num">${val}</div>${note?`<div class="t-note">${note}</div>`:''}</div>`}

function barChart(rows,valKey,labKey,partialTest){
  if(!rows||!rows.length)return '<p class="exp">No data in this period.</p>';
  const max=Math.max(...rows.map(r=>Number(r[valKey])||0))||1;
  const bars=rows.map(r=>{const v=Number(r[valKey])||0;const p=partialTest&&partialTest(r);
    return `<div class="col" title="${esc(r[labKey])} — ${n(v)}${p?' (partial period)':''}">
      <span class="v num">${n(v)}</span><div class="bar${p?' part':''}" style="height:${Math.max(2,100*v/max)}%"></div></div>`}).join('');
  const ax=rows.map(r=>`<span>${esc(String(r[labKey]).slice(5))}</span>`).join('');
  return `<div class="chart">${bars}</div><div class="xax">${ax}</div>`;
}

/* ---------- Overview: the client-facing report ----------
   This tab is the deliverable. It is read in a meeting, so it is built like the
   AIM PDF: banded sections, donuts with legends, and figures that either come
   from an API response or say plainly that nothing was measured. Nothing here
   substitutes a zero for a missing source. */

const ENGN={google:'Google',google_local:'Google Local',bing:'Bing',
            google_mobile:'Google Mobile'};
const CHAN=['var(--c1)','var(--c2)','var(--c3)','var(--c4)',
            'var(--c5)','var(--c6)','var(--c7)','var(--c8)'];
const ORG=r=>String(r.channel||'').toLowerCase()==='organic search';
const p1=v=>(v==null||!isFinite(v))?'—':Number(v).toFixed(1)+'%';
const cliRow=()=>S.clients.filter(c=>c.id==S.client)[0]||{};

// A date a client reads, not an ISO stamp.
function niceDate(s){
  if(!s)return '—';
  const t=String(s), d=new Date(t.length===10?t+'T00:00:00':t);
  return isNaN(d)?t:d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}

// A source that never connected must read as "not connected". A zero is a
// measurement, and no measurement was taken — the two must not look alike.
function vHealth(d,source){
  const row=(d.health||[]).filter(h=>h.source===source)[0];
  if(!row)return{known:false,ok:false,state:'absent',label:'not connected'};
  const ok=row.status==='connected';
  return{known:true,ok,state:row.status,last:row.last_success,
    label:ok?('connected'+(row.last_success
              ?' · last read '+niceDate(String(row.last_success).slice(0,10)):''))
            :(row.status==='error'?'connection error':'not connected')};
}

function ncPanel(title,body,metrics){

/* ---- donuts ---- */
// Segments are drawn as one circle per slice: dasharray sets the arc length and
// dashoffset walks it round the ring, which keeps this to plain SVG with no
// path arithmetic.
function donutMulti(rows,centre,caption){
  const total=rows.reduce((a,r)=>a+(Number(r.v)||0),0);
  const R=52,C=2*Math.PI*R;
  let acc=0;
  const arcs=total>0?rows.map((row,i)=>{
    const len=(Number(row.v)||0)/total*C, off=-acc; acc+=len;
    return `<circle cx="65" cy="65" r="${R}" fill="none" stroke="${CHAN[i%CHAN.length]}"
      stroke-width="17" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 65 65)"></circle>`;
  }).join(''):'';
  return `<svg viewBox="0 0 130 130" width="132" height="132" role="img"
    aria-label="${esc(caption)}: ${esc(centre)}, split by channel">
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--soft)" stroke-width="17"/>
    ${arcs}
    <text x="65" y="60" text-anchor="middle" dominant-baseline="middle"
      font-family="Fraunces,Georgia,serif" font-weight="700"
      font-size="${String(centre).length>5?18:23}" fill="var(--ink)">${esc(centre)}</text>
    <text x="65" y="83" text-anchor="middle" font-family="IBM Plex Mono,monospace"
      font-size="${String(caption).length>13?7:9}" fill="var(--muted)">${esc(caption)}</text>
  </svg>`;
}

function donutCard(title,note,rows){
  const total=rows.reduce((a,r)=>a+(Number(r.v)||0),0);
  const leg=rows.map((r,i)=>`<div class="row">
    <span class="sw2" style="background:${CHAN[i%CHAN.length]}"></span>
    <span class="nm" title="${esc(r.k)}">${esc(r.k)}</span>
    <span class="vv">${n(r.v)}</span>
    <span class="pp">${total>0?(100*(Number(r.v)||0)/total).toFixed(1)+'%':'—'}</span>
  </div>`).join('');
  return `<div class="dcard"><div class="h">${esc(title)}</div>
    <div class="n">${esc(note)}</div>
    <div class="dbody">${donutMulti(rows,n(total),title.toUpperCase())}
      <div class="dleg">${leg}</div></div></div>`;
}

function donutPending(title,note,why){
  return `<div class="dcard"><div class="h">${esc(title)}</div>
    <div class="n">${esc(note)}</div>
    <div class="pending" style="margin:0"><b>Not measured yet.</b> ${esc(why)}</div></div>`;
}

    ${nxt?`<div class="sumblk"><h4>Recommended Next Steps</h4>
      <ol class="nextl">${nxt}</ol></div>`:''}
    <p class="sumcap">Generated ${niceDate(String(s.generated_at||'').slice(0,10))}${
      s.model?` · ${esc(s.model)}`:''}${
      s.age_hours!=null?` · ${esc(String(s.age_hours))} hours old`:''}<br>
      ${s.cached?'Read from the stored summary for this period.'
        :s.saved?'Written just now and stored, so it will be here next time you open this period.'
        :`Written just now, but it could not be stored${
            s.saveError?' ('+esc(s.saveError)+')':''}, so it will need regenerating next visit.`}
      </p>
    <button class="genbtn" id="gensum">Regenerate</button></section>`;
}

async function genSummary(){
  const key=sumKey();
  S.summaryState='loading'; S.summaryErr=null; render();
  try{
    const r=await fetch(ASK,{method:'POST',
      headers:{'Content-Type':'application/json','x-aim-session':tok()||''},
      body:JSON.stringify({mode:'report',client_id:S.client,from:S.from,to:S.to})});
    if(r.status===401){
      if(await sessionAlive())
        throw new Error('The summary service rejected this sign-in, but your session is '+
          'still valid everywhere else, so you have not been signed out. This means the '+
          'ask function is out of step with the dashboard and needs redeploying.');
      sessionStorage.removeItem(STORE);
      showLogin('Session expired — sign in again.');return}
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.error)throw new Error(j.detail||j.error||`Request failed (${r.status})`);
    const rep=j.report||{};
    const rec={summary:rep.summary||'',points:rep.points||[],why:rep.why||'',
      next_steps:rep.next_steps||rep.next||[],model:j.model||null,
      generated_at:new Date().toISOString(),cached:false,
      saved:j.saved===true,saveError:j.save_error||null};
    S.summaryCache[key]=rec;
    if(key===sumKey()){S.summary=rec;S.summaryState='ready';render()}
  }catch(e){
    if(key===sumKey()){S.summaryErr=e.message;S.summaryState='error';render()}
  }
}

/* ---- 4. front page placement ---- */
/* ---- 4a. placement over time ----
   Agency Analytics answers "which way is this going" with one stacked bar chart
   per engine. That puts four y-axes on the page, so the engines cannot be read
   against each other and the eye has to hold four pictures at once. This is one
   chart instead: a line per engine on a single axis, so the shape of each engine
   and the gap between them are both readable at a glance. The stacked bars below
   still answer "how is today split", which a line cannot.

   Two measures, because they are different questions. Page one is reach — how
   much of the tracked list a searcher could find at all. The top three is the
   part that actually gets clicked. */
const MOVEM=[['page1','Page one (1–10)'],['top3','Top three (1–3)']];
const MOVEW={page1:'on page one',top3:'in the top three'};
// Colour follows the engine, never its position in the payload, so an engine
// that drops out of one period does not repaint the others.
const ENGC={google:'var(--e1)',google_local:'var(--e2)',
            google_mobile:'var(--e3)',bing:'var(--e4)'};
// Short forms for the crosshair readout, where four full names will not fit.
const ENGS={google:'Google',google_local:'Local',google_mobile:'Mobile',bing:'Bing'};

function moveSeries(mv,metric){
  const pts=(mv&&mv.points)||[];
  const seen=[];
  pts.forEach(p=>(p.engines||[]).forEach(e=>{
    if(seen.indexOf(e.engine)<0)seen.push(e.engine)}));
  const order=ENG_ORDER.filter(e=>seen.indexOf(e)>=0)
    .concat(seen.filter(e=>ENG_ORDER.indexOf(e)<0));
  return order.map((eng,i)=>({
    engine:eng,
    color:ENGC[eng]||CHAN[i%CHAN.length],
    values:pts.map(p=>{
      const r=(p.engines||[]).filter(x=>x.engine===eng)[0];
      return r?(Number(r[metric])||0):null;
    })
  }));
}

// First and last reading a series actually has, so an engine that started
// mid-window is compared against its own first point rather than against zero.
function movDelta(vals){
  const at=[];
  (vals||[]).forEach((v,i)=>{if(v!=null)at.push(i)});
  if(at.length<2)return null;
  const a=vals[at[0]],b=vals[at[at.length-1]];
  return {from:a,to:b,d:b-a,i0:at[0],i1:at[at.length-1]};
}
// The arrow carries the direction as well as the colour, so the change is not
// signalled by colour alone.
function deltaTag(dl,cls,unit){
  if(!dl)return '';
  const w=dl.d>0?'up':dl.d<0?'down':'flat';
  const t=dl.d>0?'▲ +'+n(dl.d):dl.d<0?'▼ '+n(dl.d):'▬ 0';
  return `<span class="${cls} ${w}">${t}${unit?' '+esc(unit):''}</span>`;
}

// A round ceiling above the tallest point. The steps are chosen so the gap
// between gridlines is always a whole number of phrases, and fine enough that a
// chart topping out at 255 is not drawn on an axis running to 400.
function axisTop(max){
  const want=Math.max(1,max)/4;
  const mag=Math.pow(10,Math.max(0,Math.floor(Math.log10(want))));
  const steps=mag<10?[1,2,3,4,5,6,8,10]:[1,1.5,2,2.5,3,4,5,6,7.5,8,10];
  for(const st of steps)if(st*mag>=want)return st*mag*4;
  return 40*mag;
}

/* One SVG, no chart library. Grid and axes are hairlines behind the data; the
   lines are 2px; every bucket has a full-height hover band that reveals a
   crosshair and a one-line readout of all four engines at that date, and
   carries the same text as a native title so touch and screen readers get it
   too. Each line is labelled at its right-hand end as well as in the legend,
   so identity never rests on colour alone. */
function lineChart(labels,series,aria){
  const W=820,H=274,PL=46,PR=112,PT=28,PB=32;
  const iw=W-PL-PR,ih=H-PT-PB;
  const flat=[].concat.apply([],series.map(s=>s.values)).filter(v=>v!=null);
  const top=axisTop(flat.length?Math.max.apply(null,flat):1);
  const x=i=>labels.length<2?PL+iw/2:PL+iw*i/(labels.length-1);
  const y=v=>PT+ih-ih*v/top;
  const mono='IBM Plex Mono,ui-monospace,monospace';

  let grid='';
  for(let g=0;g<=4;g++){
    const v=top*g/4,yy=y(v);
    grid+=`<line x1="${PL}" x2="${PL+iw}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"
      stroke="var(--line)" stroke-width="1"/>
      <text x="${PL-9}" y="${(yy+3.6).toFixed(1)}" text-anchor="end" font-size="10.5"
        font-family="${mono}" fill="var(--muted)">${n(v)}</text>`;
  }

  // Thin the date labels rather than let them overlap; the crosshair readout
  // names the exact bucket for the ones that are not printed.
  // Thin the date labels rather than let them collide; the crosshair readout
  // names the exact bucket for the ones that are not printed. The last bucket
  // is always labelled, and the one before it is dropped if that would crowd it.
  const every=Math.ceil(labels.length/8),last=labels.length-1,keep=[];
  for(let i=0;i<labels.length;i+=every)keep.push(i);
  if(keep[keep.length-1]!==last){
    if(last-keep[keep.length-1]<every)keep.pop();
    keep.push(last);
  }
  const xax=keep.map(i=>{
    // The end labels anchor inwards so neither hangs off the plotted area.
    const an=i===0?'start':i===last?'end':'middle';
    return `<text x="${x(i).toFixed(1)}" y="${H-11}" text-anchor="${an}" font-size="10.5"
      font-family="${mono}" fill="var(--muted)">${esc(labels[i])}</text>`;
  }).join('');

  const paths=series.map(s=>{
    let d='',pen=false;
    s.values.forEach((v,i)=>{
      if(v==null){pen=false;return}
      d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;
    });
    return d?`<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>`:'';
  }).join('');

  // Markers on every bucket while they still fit; past that only the last one,
  // so a twelve-month view is a line rather than a string of beads.
  const dense=labels.length>14;
  const dots=series.map(s=>s.values.map((v,i)=>{
    if(v==null)return '';
    if(dense&&i!==s.values.length-1)return '';
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4"
      fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }).join('')).join('');

  // Right-hand labels, nudged apart when two engines finish close together.
  const ends=series.map(s=>{
    const dl=[];s.values.forEach((v,i)=>{if(v!=null)dl.push(i)});
    if(!dl.length)return null;
    const i=dl[dl.length-1];
    return {s:s,v:s.values[i],y:y(s.values[i])};
  }).filter(Boolean).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++)
    if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
  const spill=ends.length?ends[ends.length-1].y-(PT+ih):0;
  if(spill>0)ends.forEach(e=>{e.y-=spill});
  const endlab=ends.map(e=>`<text x="${PL+iw+11}" y="${(e.y+3.6).toFixed(1)}"
    font-size="11" font-family="${mono}" fill="var(--secondary)"
    ><tspan fill="${e.s.color}">■</tspan> ${esc(ENGS[e.s.engine]||e.s.engine)} ${
      n(e.v)}</text>`).join('');

  const bw=labels.length<2?iw:iw/(labels.length-1);
  const bands=labels.map((lb,i)=>{
    const bx=Math.max(PL,x(i)-bw/2),wd=Math.min(bw,PL+iw-bx);
    const parts=series.map(s=>s.values[i]==null?null
      :`${ENGS[s.engine]||s.engine} ${n(s.values[i])}`).filter(Boolean).join('   ');
    const line=`${lb} — ${parts||'no reading'}`;
    return `<g class="bnd">
      <rect x="${bx.toFixed(1)}" y="${PT}" width="${Math.max(1,wd).toFixed(1)}"
        height="${ih}" fill="transparent"><title>${esc(line)}</title></rect>
      <line class="cx" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}"
        y1="${PT}" y2="${PT+ih}" stroke="var(--muted)" stroke-width="1"
        stroke-dasharray="3 3"/>
      <text class="rdt" x="${PL}" y="${PT-9}" font-size="11" font-family="${mono}"
        fill="var(--secondary)">${esc(line)}</text></g>`;
  }).join('');

  return `<svg class="lnchart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc(aria)}">${grid}${xax}${paths}${dots}${endlab}${bands}</svg>`;
}

function moveTable(mv,series,metric){
  const pts=(mv&&mv.points)||[];
  const head=series.map(s=>`<th class="n">${esc(ENGN[s.engine]||s.engine)}</th>`).join('');
  const body=pts.map((p,i)=>`<tr><td>${esc(p.label)}</td>${
    series.map(s=>`<td class="n num">${n(s.values[i])}</td>`).join('')}
    <td class="n num">${n(p.unified?p.unified[metric]:null)}</td>
    <td class="n num">${n(p.unified?p.unified.tracked:null)}</td></tr>`).join('');
  return `<details class="mvtab"><summary>Show these numbers as a table</summary>
    <div class="tw"><table><thead><tr><th>Period ending</th>${head}
      <th class="n">Any engine</th><th class="n">Tracked</th></tr></thead>
      <tbody>${body}</tbody></table></div></details>`;
}

function ovMovement(){
  const mv=S.rankMove;
  if(!mv||!mv.points)
    return `<div class="pending" style="margin-top:22px"><b>Movement over time is
      unavailable.</b> The placement history read did not answer, so nothing is drawn
      rather than a flat line. The figures above come from a separate call and are
      unaffected.</div>`;
  const pts=mv.points;
  if(!pts.length)
    return `<div class="pending" style="margin-top:22px"><b>No ranking history inside
      this window.</b> Nothing was recorded between these dates, so there is no movement
      to draw.</div>`;

  const metric=S.placeMetric==='top3'?'top3':'page1';
  const series=moveSeries(mv,metric);
  const labels=pts.map(p=>p.label||String(p.d||'').slice(5));
  const unit=mv.unit==='week'?'week':'month';

  const toggle=`<div class="seg">${MOVEM.map(([k,l])=>
    `<button data-act="place-${k}" class="${metric===k?'on':''}">${l}</button>`).join('')}</div>`;

  const leg=series.map(s=>{
    const dl=movDelta(s.values);
    const last=s.values.filter(v=>v!=null).slice(-1)[0];
    return `<div class="row"><span class="sw2" style="background:${s.color}"></span>
      <span class="nm">${esc(ENGN[s.engine]||s.engine)}</span>
      <span class="vv">${n(last==null?null:last)}${deltaTag(dl,'dd')}</span></div>`;
  }).join('');

  const uni=movDelta(pts.map(p=>p.unified?Number(p.unified[metric]):null));

  // Coverage moves as well as placement. A phrase added mid-window, or an engine
  // the collector only began reading part way through, changes a count without
  // anything having ranked differently — so where the change is big enough to
  // read the line wrongly, the paragraph says so.
  const cover=series.map(s=>{
    const dl=movDelta(pts.map(p=>{
      const r=(p.engines||[]).filter(x=>x.engine===s.engine)[0];
      return r?(Number(r.tracked)||0):null;
    }));
    if(!dl||!dl.from||Math.abs(dl.d)/dl.from<0.1)return null;
    return `${esc(ENGN[s.engine]||s.engine)} was read on ${n(dl.from)} of them at the start
      of this window and ${n(dl.to)} at the end`;
  }).filter(Boolean);
  const track=cover.length
    ? ` Coverage changed too, so part of the movement is the tracked list rather than the
        ranking: ${cover.join('; ')}.`
    : '';

  const chart=pts.length<2
    ? `<div class="pending"><b>Only one reading falls inside this window.</b>
       Movement needs two, so widen the date range — a quarter or more gives a full set
       of monthly points.</div>`
    : `<div class="lnwrap">${lineChart(labels,series,
        `Tracked phrases ${MOVEW[metric]} by ${unit}, one line per search engine`)}
       <div class="mvleg">${leg}</div></div>`;

  // The note names the measure as well as the toggle showing it, because the
  // toggle is a control and does not print.
  return `<div class="mvhead"><div>
      <p class="t">How this moved over the period</p>
      <p class="n">Tracked phrases ${MOVEW[metric]}, where they stood at the end of each
      ${unit}, on one axis. The last point is the same figure as the tiles above.</p>
    </div>${toggle}</div>
    ${chart}
    <p class="exp" style="margin-top:12px">${
      uni?`Counting every phrase once at its best position across all engines, the number
           ${MOVEW[metric]} went from <b>${n(uni.from)}</b> to <b>${n(uni.to)}</b> across
           this window${uni.d===0?'':`, a ${uni.d>0?'gain':'fall'} of <b>${
             n(Math.abs(uni.d))}</b>`}.`
        :'Each line counts placements on one engine, so a phrase ranking on three engines appears on three lines.'
      }${track}</p>
    ${pts.length>1?moveTable(mv,series,metric):''}`;
}

// The change shown on a tile is read from the same series the chart draws, so
// the headline and the line underneath it can never disagree.
function tileMove(engine){
  const pts=(S.rankMove&&S.rankMove.points)||[];
  if(pts.length<2)return '';
  const dl=movDelta(pts.map(p=>{
    const r=(p.engines||[]).filter(x=>x.engine===engine)[0];
    return r?(Number(r.page1)||0):null;
  }));
  if(!dl)return '';
  const from=(pts[dl.i0]||{}).label;
  return `<div class="mv ${dl.d>0?'up':dl.d<0?'down':'flat'}">${
    dl.d>0?'\u25b2 +'+n(dl.d):dl.d<0?'\u25bc '+n(dl.d):'\u25ac no change'}${
    from?' since '+esc(from):''}</div>`;
}

function ovPlacement(d){
  const rows=d.rankings_by_engine||[],u=d.rankings_unified||{};
  if(!rows.length)
    return ncPanel('No ranking data for this period.',
      'Nothing was recorded inside the selected window — widen the date range, or check '+
      'that rank tracking is running for this client.',
      ['Google','Google Local','Bing']);

  const byEng={}; rows.forEach(r=>{byEng[r.engine]=r});
  const big=ENG_ORDER.map(k=>{
    const r=byEng[k];
    if(!r)return `<div class="stat"><div class="v" style="color:var(--muted)">—</div>
      <div class="l">${esc(ENGN[k])}</div>
      <div class="d">Not tracked on this engine.</div></div>`;
    return `<div class="stat"><div class="v">${n(r.page1)}</div>
      <div class="l">${esc(ENGN[k])} — terms on page one</div>
      <div class="d">${n(r.top3)} of them in the top three, of ${n(r.tracked)} tracked</div>
      ${tileMove(k)}
    </div>`;
  }).join('');

  const ordered=ENG_ORDER.map(k=>byEng[k]).filter(Boolean)
    .concat(rows.filter(r=>ENG_ORDER.indexOf(r.engine)<0));
  const bars=ordered.map(r=>{
    const tracked=Number(r.tracked)||0;
    if(!tracked)return '';
    const t3=Number(r.top3)||0,p4=Number(r.p4_10)||0,rest=Math.max(0,tracked-t3-p4);
    const w=v=>(100*v/tracked).toFixed(2)+'%';
    return `<div class="stkrow"><div class="lb">${esc(ENGN[r.engine]||r.engine)}</div>
      <div class="stkbar" title="${esc(ENGN[r.engine]||r.engine)}: ${n(t3)} in positions 1–3, ${
        n(p4)} in 4–10, of ${n(tracked)} tracked">
        <span style="width:${w(t3)};background:var(--c1)">${
          t3/tracked>.11?`<em>${n(t3)}</em>`:''}</span>
        <span style="width:${w(p4)};background:var(--c2)">${
          p4/tracked>.11?`<em>${n(p4)}</em>`:''}</span>
        <span style="width:${w(rest)}"></span>
      </div></div>`;
  }).join('');

  return `<div class="stats">${big}</div>
    <p class="exp">Every tracked term, split by where it sits. The bar runs the full tracked
    list, so the unfilled part is everything still below position ten.</p>
    <div class="stk">${bars}</div>
    <div class="legend">
      <div class="lg"><span class="sw" style="background:var(--c1)"></span>Positions 1–3</div>
      <div class="lg"><span class="sw" style="background:var(--c2)"></span>Positions 4–10</div>
      <div class="lg"><span class="sw" style="background:var(--soft);border:1px solid var(--line)"></span>Below position 10</div>
    </div>
    <p class="exp" style="margin-top:14px">Counting every term once at its best position across
    all engines, <b>${n(u.page1)}</b> of ${n(u.tracked)} tracked terms are on page one, and
    <b>${n(u.top3)}</b> are in the top three.</p>
    ${ovMovement()}`;
}

/* ---- 5. search traffic donuts ---- */
function ovTraffic(d){
  const t=(d.traffic||[]).slice();
  const ga=vHealth(d,'ga4');
  if(!t.length)
    return ncPanel(ga.ok?'No traffic recorded in this period.'
                        :'Website analytics is not connected.',
      ga.ok?'The GA4 connection is live but returned nothing inside this date range.'
           :'Nothing is being collected for this client, so there is no figure to show.',
      ['Total users','New users','Views']);

  // Each measure renders the moment the reporting API carries it; until then it
  // says so rather than showing a zero ring.
  const MEAS=[
    {key:'users',title:'Total Users',note:'Everyone who visited the site, by channel'},
    {key:'sessions',title:'Sessions',note:'Visits, by channel'},
    {key:'new_users',title:'New Users',note:'First-time visitors, by channel',
      why:'New-user counts are collected in GA4 but the reporting API does not return them yet.'},
    {key:'views',title:'Views',note:'Pages viewed, by channel',
      why:'Page views are not collected — the GA4 ingest carries no views dimension.'}
  ];

  const cards=MEAS.map(m=>{
    const rows=t.filter(r=>r[m.key]!=null)
                .map(r=>({k:r.channel,v:Number(r[m.key])||0}))
                .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
    return rows.length?donutCard(m.title,m.note,rows)
      :donutPending(m.title,m.note,m.why||'No figure was returned for this period.');
  }).join('');

  const conv=t.reduce((a,r)=>a+(Number(r.conversions)||0),0);
  return `<div class="dnuts">${cards}</div>
    <p class="exp" style="margin-top:14px">Channels are GA4's default grouping. ${
      conv>0?`<b>${n(conv)}</b> conversions were recorded across all channels in this period.`
            :'No conversions were recorded in this period — check that the site\'s form and call events are mapped to conversions in GA4, or they cannot be counted here.'}</p>`;
}

/* ---- 6. website performance ---- */
// Session-weighted, so a channel with three visits cannot swing the sitewide rate.
function weighted(rows,key,mult){
  let num=0,den=0;
  for(const r of rows||[]){
    const v=r[key],s=Number(r.sessions)||0;
    if(v==null||!(s>0))continue;
    num+=Number(v)*s; den+=s;
  }
  return den>0?num/den*(mult||1):null;
}
function pmet(val,label,color){
  return `<div class="m"><div class="mv" style="color:${color}">${val}</div>
    <div class="ml">${esc(label)}</div></div>`;
}
function ovPerformance(d){
  const t=d.traffic||[],tt=S.trafficTotals;
  if(!t.length&&!(tt&&tt.length))
    return ncPanel('Website analytics is not connected.',
      'Bounce and engagement both come from GA4, and nothing is being collected for '+
      'this client in this period.',['Bounce rate','Engagement rate']);

  const orgT=t.filter(ORG)[0]||null;
  const orgB=(tt||[]).filter(ORG)[0]||null;
  const engAll=weighted(t,'engagement');                 // already a percentage
  const engOrg=orgT&&orgT.engagement!=null?Number(orgT.engagement):null;
  const bnAll=tt?weighted(tt,'bounce_rate',100):null;    // stored as a fraction
  const bnOrg=orgB&&orgB.bounce_rate!=null?Number(orgB.bounce_rate)*100:null;

  // Deliberately not run through bandColor(): that rubric grades audit scores out
  // of 100. A bounce rate is a rate, and what counts as healthy varies by site, so
  // colouring it green or red would assert a judgement the number does not carry.
  const col=(title,note,e,b)=>`<div class="pcol"><div class="h">${esc(title)}</div>
    <div class="n">${esc(note)}</div><div class="pmet">
      ${pmet(p1(e),'Engagement rate — visits where someone stayed, scrolled or interacted',
             e==null?'var(--muted)':'var(--indigo)')}
      ${pmet(p1(b),'Bounce rate — visits that left without engaging',
             b==null?'var(--muted)':'var(--indigo)')}
    </div></div>`;

  return `<div class="split">
    ${col('Sitewide','Every channel, weighted by sessions',engAll,bnAll)}
    ${col('Organic search only','Visits that arrived from an unpaid search result',
          engOrg,bnOrg)}
  </div>
  ${tt===null?`<div class="pending" style="margin-top:13px"><b>Bounce rate is unavailable.</b>
    The traffic totals endpoint did not answer, so no bounce figure is shown rather than a
    placeholder.</div>`:''}
  <p class="exp" style="margin-top:14px">Engagement and bounce are measured separately and are
  not two halves of one number — they will not add to 100%.</p>`;
}

      <div class="d">Third-party authority score for the domain</div></div>
    <div class="stat"><div class="v" style="color:${spam==null?'var(--muted)':bandColor(100-spam)}">${
      spam==null?'—':spam}</div>
      <div class="l">Spam score</div>
      <div class="d">${spam==null?'Not recorded in this snapshot.'
        :'Lower is better — the share of links carrying spam signals.'}</div></div>
  </div>`;

  const nl=b.new_links==null?null:Number(b.new_links);
  const ll=b.lost_links==null?null:Number(b.lost_links);
  let trend;
  if(nl==null&&ll==null){
    trend=ncPanel('New and lost links have not been recorded yet.',
      'The collector reports a movement count only once it has two snapshots to compare, '+
      'so nothing is shown here rather than a zero.',['New links','Lost links']);
  }else{
    const max=Math.max(nl||0,ll||0,1);
    const bar=(v,c)=>`<span class="bt" style="width:min(260px,50vw)"><span class="bf"

    trend=`<div class="tw"><table><tbody>
      <tr><td>Links gained</td><td style="width:60%">${bar(nl,'var(--c7)')}</td>
        <td class="n num"><b>${nl==null?'—':n(nl)}</b></td></tr>
      <tr><td>Links lost</td><td>${bar(ll,'var(--magenta)')}</td>
        <td class="n num"><b>${ll==null?'—':n(ll)}</b></td></tr>
    </tbody></table></div>`;
  }

  return `${tiles}<h3>Movement since the last snapshot</h3>${trend}
    <p class="exp" style="margin-top:12px">Profile as at ${niceDate(b.day)}. Link data is a
    point-in-time snapshot, not a total for the reporting window.</p>`;
}

  const table=eng.length?`<div class="tw"><table><thead><tr><th>Engine</th>

    </tbody></table></div>`:'';

  return tiles+brRow+table+`<p class="exp" style="margin-top:12px">Every tracked question is
