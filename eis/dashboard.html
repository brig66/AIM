<title>AIM Executive Dashboard</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --indigo:#352597;--magenta:#c0228a;--orange:#e7730d;
  --cream:#FFFAFB;--surface:#fff;--ink:#241d3d;--secondary:#4d4763;--muted:#6b647f;
  --line:#e8e2ee;--soft:#f7f3fa;--band:#352597;--bandink:#fff;
  --good:#2e8b57;--warn:#a85f00;--bad:#b3261e;
  --good-bg:#e6f3ec;--warn-bg:#fdf1e0;--bad-bg:#fbe9e7;--info-bg:#eeebfb;
  --c-contract:#352597;--c-deal:#c0228a;--c-cost:#e7730d;--c-grid:#ece6f2;
  --shadow:0 1px 2px rgba(28,24,48,.05),0 6px 18px rgba(28,24,48,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --indigo:#8478e6;--magenta:#e05bac;--orange:#f0924a;--cream:#12101c;--surface:#1c1830;
  --ink:#fff;--secondary:#c9c3d8;--muted:#9a93ad;--line:#2f2a44;--soft:#241f38;--band:#231a63;--bandink:#fff;
  --good:#5cc08a;--warn:#f0b050;--bad:#f08070;--good-bg:#17301f;--warn-bg:#33260f;--bad-bg:#3a1a18;--info-bg:#25204a;
  --c-contract:#8478e6;--c-deal:#e05bac;--c-cost:#f0924a;--c-grid:#2a2540;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
  --indigo:#8478e6;--magenta:#e05bac;--orange:#f0924a;--cream:#12101c;--surface:#1c1830;
  --ink:#fff;--secondary:#c9c3d8;--muted:#9a93ad;--line:#2f2a44;--soft:#241f38;--band:#231a63;--bandink:#fff;
  --good:#5cc08a;--warn:#f0b050;--bad:#f08070;--good-bg:#17301f;--warn-bg:#33260f;--bad-bg:#3a1a18;--info-bg:#25204a;
  --c-contract:#8478e6;--c-deal:#e05bac;--c-cost:#f0924a;--c-grid:#2a2540;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:1180px;margin:0 auto}
.band{background:var(--band);color:var(--bandink);margin-inline:-16px;padding:22px 16px 0}
.bandtop{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.brand i{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#c0228a,#e7730d);display:inline-block}
h1{font:700 clamp(24px,3.6vw,32px)/1.15 Fraunces,Georgia,serif;margin:8px 0 0}
.fresh{font:500 11.5px "IBM Plex Mono",monospace;opacity:.85;text-align:right}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:18px;scrollbar-width:thin}
nav.tabs button{background:transparent;border:0;color:var(--bandink);opacity:.78;font:500 13.5px Inter,sans-serif;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{opacity:1}
nav.tabs button[aria-selected="true"]{background:var(--cream);color:var(--ink);opacity:1}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
main{padding-top:22px}
h2{font:700 21px/1.2 Fraunces,Georgia,serif;margin:28px 0 4px;text-wrap:balance}
h2:first-child{margin-top:0}
.sub{color:var(--muted);margin:0 0 14px;max-width:80ch}
h3{font:600 14.5px/1.3 Inter,sans-serif;margin:0 0 8px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 24px/1.2 Fraunces,Georgia,serif;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--secondary);margin-top:2px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sev{font:500 10.5px/1 "IBM Plex Mono",monospace;padding:5px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;margin-top:1px}
.sev.critical{background:var(--bad-bg);color:var(--bad)}
.sev.warn{background:var(--warn-bg);color:var(--warn)}
.sev.info{background:var(--info-bg);color:var(--indigo)}
.alert .area{font-weight:600}
.alert .t{color:var(--secondary)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.num{font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
tfoot td{font-weight:600;background:var(--soft)}
.pill{display:inline-block;font:500 11px/1 "IBM Plex Mono",monospace;padding:5px 8px;border-radius:999px;white-space:nowrap}
.p-first{background:var(--info-bg);color:var(--indigo)}
.p-renewed{background:var(--good-bg);color:var(--good)}
.p-mtm{background:var(--warn-bg);color:var(--warn)}
.p-initial{background:var(--soft);color:var(--secondary);border:1px solid var(--line)}
.p-none{background:var(--soft);color:var(--muted);border:1px dashed var(--line)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-good{background:var(--good-bg);color:var(--good)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.btn{font:600 13px Inter,sans-serif;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#12101c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#12101c}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--indigo);padding:4px 6px;text-decoration:underline;font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar .grow{flex:1}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{font:13px Inter,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:100%}
input.cell{width:92px;text-align:right;font-variant-numeric:tabular-nums;padding:5px 6px}
input.mini{width:90px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{font-size:14px;width:100%}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form .wide{grid-column:1/-1}
.drawer{position:fixed;inset:0;background:rgba(20,16,40,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer .sheet{background:var(--cream);width:min(560px,100%);height:100%;overflow:auto;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.drawer .sheet h2{margin-top:0}
.drawer .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.note{background:var(--info-bg);border-radius:10px;padding:10px 14px;color:var(--secondary);font-size:13px;margin:0 0 14px}
.note.warn{background:var(--warn-bg)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--secondary);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:999px;font-weight:500;z-index:30}
.empty{padding:22px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--indigo)}
.bar span.over{background:var(--bad)}
.scen{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:12px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--magenta)}
tr.modeled td{background:color-mix(in srgb,var(--magenta) 7%,transparent)}
footer{margin-top:40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="band">
  <div class="wrap">
    <div class="bandtop">
      <div>
        <div class="brand"><i aria-hidden="true"></i>Advanced Integrated Marketing</div>
        <h1>Executive Dashboard</h1>
      </div>
      <div class="fresh" id="fresh">Loading data…</div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<footer class="wrap">Private to AIM. Sources: QuickBooks Online, HubSpot, AIM analytics platform, vendor receipts. Numbers refresh every morning. Contracts, budgets and deal scenarios are entered here.</footer>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------------------------------------------------------------- state */
const TABS=[['today','Today'],['clients','Clients & Contracts'],['pipeline','Pipeline & Modeling'],['finance','Finance'],['budget','Budget'],['support','Support'],['health','Client Health'],['ai','AI & Software'],['platform','Platform']];
const S={tab:'today',snap:{},contracts:[],budgets:{},models:{},settings:{},db:null,canEdit:false,loaded:{snap:false,contracts:false},budgetYear:null,budgetDraft:null,clientFilter:'all',dealFilter:'open'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
try{const t=localStorage.getItem('aim-eis-tab');if(t&&TABS.some(x=>x[0]===t))S.tab=t;}catch(e){}
if(location.hash){const h=location.hash.slice(1);if(TABS.some(x=>x[0]===h))S.tab=h;}

/* -------------------------------------------------------------- helpers */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>typeof v==='number'&&isFinite(v);
const money=(v,opt)=>{if(!isNum(v))return '—';const n=Math.round(v);const s=Math.abs(n).toLocaleString('en-US');return (n<0?'−$':'$')+s;};
const kmoney=v=>{if(!isNum(v))return '—';const a=Math.abs(v);const sign=v<0?'−':'';if(a>=1e6)return sign+'$'+(a/1e6).toFixed(1)+'M';if(a>=1e4)return sign+'$'+Math.round(a/1e3)+'K';if(a>=1e3)return sign+'$'+(a/1e3).toFixed(1)+'K';return sign+'$'+Math.round(a);};
const pct=(v,d=0)=>isNum(v)?(v*100).toFixed(d)+'%':'—';
const hrs=h=>{if(!isNum(h))return '—';if(h<48)return (h<10?h.toFixed(1):Math.round(h))+' hrs';return (h/24).toFixed(1)+' days';};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const ym=d=>d.slice(0,7);
const addMonths=(key,n)=>{let [y,m]=key.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+String(m).padStart(2,'0');};
const mLabel=key=>{const [y,m]=key.split('-').map(Number);return MONTHS[m-1]+" '"+String(y).slice(2);};
const parseD=s=>{if(!s)return null;const d=new Date(s+'T12:00:00');return isNaN(d)?null:d;};
const days=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const addMonthsDate=(iso,n)=>{const d=parseD(iso);if(!d)return null;const t=new Date(d);t.setMonth(t.getMonth()+n);t.setDate(t.getDate()-1);return t.toISOString().slice(0,10);};
const fmtDate=iso=>{const d=parseD(iso);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';};
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},2600);}
const F=()=>S.snap.finance||null, T=()=>S.snap.tickets||null, D=()=>S.snap.deals||null, H=()=>S.snap.clients||null, O=()=>S.snap.ops||null, M=()=>S.snap.meta||null;

/* ------------------------------------------------------ contract logic */
function contractEnd(c){if(c.end)return c.end;if(c.start&&c.term_months)return addMonthsDate(c.start,Number(c.term_months));return null;}
function contractStatus(c){
  const today=todayISO();
  if(c.active===false)return {k:'none',label:'Inactive'};
  if(c.billing==='mtm')return {k:'mtm',label:'Month-to-month'};
  if(!c.start)return {k:'none',label:'Needs dates'};
  const since=c.client_since||c.start;
  if(days(since,c.start)>31)return {k:'renewed',label:'Renewed'};
  if(days(since,today)<=366)return {k:'first',label:'First year'};
  return {k:'initial',label:'Initial term, year 2+'};
}
function contractFlags(c){
  const out=[];if(c.active===false)return out;
  const today=todayISO();const end=contractEnd(c);
  if(!isNum(c.monthly))out.push({k:'warn',t:'No monthly value'});
  if(c.billing!=='mtm'&&end){const d=days(today,end);
    if(d<0)out.push({k:'bad',t:'Ended '+fmtDate(end)});
    else if(d<=60)out.push({k:'warn',t:'Ends in '+d+' days'});}
  return out;
}
function salesFor(c){const f=F();if(!f||!f.sales_by_customer)return null;const key=norm(c.qb_name||c.name);return f.sales_by_customer.find(r=>norm(r.customer)===key)||null;}
function asOfMonth(){const f=F();return ym((f&&f.as_of)||todayISO());}
function lastFullMonth(){return addMonths(asOfMonth(),-1);}
function activeContracts(){return S.contracts.filter(c=>c.active!==false);}
function contractedMRR(){return activeContracts().reduce((s,c)=>s+(isNum(c.monthly)?c.monthly:0),0);}

/* ---------------------------------------------------------- projection */
function directCostPct(){
  if(isNum(S.settings.direct_cost_pct))return S.settings.direct_cost_pct;
  const f=F();if(f&&f.pl_ytd&&f.pl_ytd.income)return f.pl_ytd.cogs/f.pl_ytd.income;return 0.2;
}
function opexBaseline(monthKey){
  const y=monthKey.slice(0,4);const b=S.budgets[y];const mi=Number(monthKey.slice(5))-1;
  if(b&&b.categories){let t=0,any=false;for(const k in b.categories){const v=b.categories[k]&&b.categories[k][mi];if(isNum(v)){t+=v;any=true;}}if(any)return {v:t,src:'budget'};}
  const f=F();if(!f||!f.pl_months)return {v:0,src:'none'};
  const cur=asOfMonth();const full=f.pl_months.filter(m=>m.month<cur).slice(-3);
  if(!full.length)return {v:0,src:'none'};
  return {v:full.reduce((s,m)=>s+(m.expenses||0),0)/full.length,src:'run-rate'};
}
function dealDefaults(d){
  const close=d.close_date&&d.close_date>=todayISO()?d.close_date:todayISO();
  return {include:false,kind:'monthly',value:isNum(d.amount)?d.amount:0,term:12,start:addMonths(ym(close),1)};
}
function dealModel(d){return Object.assign(dealDefaults(d),S.models[d.id]||{});}
function projection(n){
  n=n||12;const start=ym(todayISO());const months=[];for(let i=0;i<n;i++)months.push(addMonths(start,i));
  const renew=!!S.settings.assume_renewals;const pctC=directCostPct();
  const contracted=months.map(m=>{let t=0;for(const c of activeContracts()){if(!isNum(c.monthly))continue;
    if(c.start&&ym(c.start)>m)continue;
    if(c.billing!=='mtm'){const e=contractEnd(c);if(e&&ym(e)<m&&!renew)continue;}
    t+=c.monthly;}return t;});
  const deals=D()?D().deals.filter(d=>d.open):[];
  const modeled=months.map(()=>0);
  for(const d of deals){const md=dealModel(d);if(!md.include||!isNum(Number(md.value)))continue;const v=Number(md.value);
    months.forEach((m,i)=>{if(md.kind==='onetime'){if(m===md.start)modeled[i]+=v;}
      else{const endM=addMonths(md.start,Math.max(1,Number(md.term)||12)-1);if(m>=md.start&&m<=endM)modeled[i]+=v;}});}
  const opex=months.map(m=>opexBaseline(m));
  const rows=months.map((m,i)=>{const rev=contracted[i]+modeled[i];const cogs=rev*pctC;const ox=opex[i].v;
    return {m,contracted:contracted[i],modeled:modeled[i],rev,cogs,opex:ox,opexSrc:opex[i].src,profit:rev-cogs-ox,baseProfit:contracted[i]*(1-pctC)-ox};});
  return rows;
}
function weightedPipeline(){
  const d=D();if(!d)return null;const st={};(d.stages||[]).forEach(s=>st[s.id]=s);
  let w=0,has=false;for(const x of d.deals.filter(x=>x.open)){const p=st[x.stage_id]&&st[x.stage_id].probability;if(isNum(p)&&isNum(x.amount)){w+=x.amount*(p>1?p/100:p);has=true;}}
  return has?w:null;
}

/* ------------------------------------------------------------ alerts */
function allAlerts(){
  const out=[];const m=M();
  if(m&&Array.isArray(m.alerts))m.alerts.forEach(a=>out.push(a));
  for(const c of activeContracts()){for(const f of contractFlags(c)){if(f.t==='No monthly value')continue;out.push({severity:f.k==='bad'?'critical':'warn',area:'Contract',text:(c.name||'Client')+': '+f.t+(c.billing!=='mtm'?' — renew or switch to month-to-month.':'')});}}
  const missing=activeContracts().filter(c=>!isNum(c.monthly)).length;
  if(missing)out.push({severity:'info',area:'Setup',text:missing+' client'+(missing>1?'s have':' has')+' no expected monthly revenue yet. Add it under Clients & Contracts.'});
  const lf=lastFullMonth();
  for(const c of activeContracts()){if(!isNum(c.monthly)||c.monthly<=0)continue;const s=salesFor(c);if(!s)continue;const a=s.months&&s.months[lf];
    if(isNum(a)&&a<c.monthly*0.9)out.push({severity:'warn',area:'Billing',text:(c.name)+' was billed '+money(a)+' in '+mLabel(lf)+' against '+money(c.monthly)+' expected.'});}
  const rank={critical:0,warn:1,info:2};out.sort((a,b)=>(rank[a.severity]??3)-(rank[b.severity]??3));
  return out;
}

/* ------------------------------------------------------------- charts */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p;}
function barChart(o){
  const W=760,Hh=o.height||240,padL=56,padR=12,padT=12,padB=28;const n=o.labels.length;
  const stackTot=o.labels.map((_,i)=>o.series.reduce((s,se)=>s+Math.max(0,se.values[i]||0),0));
  let max=Math.max(...stackTot,...(o.line?o.line.values:[0]),0);
  let min=Math.min(0,...(o.line2?o.line2.values:[0]));
  const step=niceMax(((max-min)||1)/4);max=Math.ceil(max*1.02/step)*step||step;min=min<0?Math.floor(min*1.02/step)*step:0;
  const y=v=>padT+(Hh-padT-padB)*(1-(v-min)/(max-min));
  const bw=(W-padL-padR)/n;const bar=Math.min(38,bw*0.62);
  let g='';
  for(let v=min;v<=max+step/2;v+=step){const yy=y(v);g+=`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="var(--c-grid)" stroke-width="1"/><text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${esc(kmoney(v))}</text>`;}
  if(min<0)g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  o.labels.forEach((lab,i)=>{const cx=padL+bw*i+bw/2;let base=0;

document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;try{localStorage.setItem('aim-eis-tab',S.tab);}catch(_){}render();return;}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='add-client'){openDrawer(null);}
  else if(act==='edit-client'){openDrawer(S.contracts.find(c=>c.id===b.dataset.id));}
  else if(act==='close-drawer'){closeDrawer();}
  else if(act==='save-client'){await saveClient(b.dataset.id,b);}
  else if(act==='deactivate'){const c=S.contracts.find(x=>x.id===b.dataset.id);if(c){await writeDoc('contracts/'+c.id,Object.assign(strip(c),{active:c.active===false,updated_at:new Date().toISOString()}),'Saved');closeDrawer();}}

  else if(act==='discard-budget'){S.budgetDraft=null;render();}
  else if(act==='save-budget'){await saveBudget(b);}
  else if(act==='clear-models'){if(!S.canEdit)return;const ids=Object.keys(S.models);for(const id of ids){await writeDoc('deal_models/'+id,Object.assign({},strip(S.models[id]),{include:false,updated_at:new Date().toISOString()}),null);}toast('Scenario cleared');}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='cfilter'){S.clientFilter=t.value;render();return;}
  if(t.id==='dfilter'){S.dealFilter=t.value;render();return;}
  if(t.id==='byear'){S.budgetYear=t.value;S.budgetDraft=null;render();return;}
  if(t.id==='renew'){await writeDoc('settings/main',Object.assign({},S.settings,{assume_renewals:t.checked}),null);S.settings.assume_renewals=t.checked;renderProjection();return;}
  if(t.id==='dcp'){const v=Number(t.value);if(isNum(v)&&v>=0&&v<=100){S.settings.direct_cost_pct=v/100;renderProjection();await writeDoc('settings/main',Object.assign({},S.settings),null);}return;}

  const tr=t.closest('tr[data-deal]');
  if(tr&&t.dataset.f){if(!S.canEdit)return;const id=tr.dataset.deal;const deal=D().deals.find(x=>x.id===id);const md=dealModel(deal);
    const f=t.dataset.f;let v=t.type==='checkbox'?t.checked:t.value;if(f==='value'||f==='term')v=Number(v)||0;md[f]=v;

  if(key==='__revenue'){S.budgetDraft.revenue[i]=val;}else{if(!S.budgetDraft.categories[key])S.budgetDraft.categories[key]=Array(12).fill(null);S.budgetDraft.categories[key][i]=val;}}
function markBudgetDirty(){const s=document.querySelector('[data-act="save-budget"]'),d=document.querySelector('[data-act="discard-budget"]');if(s)s.disabled=false;if(d)d.disabled=false;
  const tb=$('#btable');if(tb){tb.querySelectorAll('tbody tr').forEach(tr=>{const ins=[...tr.querySelectorAll('input')];if(!ins.length)return;const tot=ins.reduce((s,i)=>s+(Number(String(i.value).replace(/[$,]/g,''))||0),0);tr.lastElementChild.innerHTML='<b>'+money(tot)+'</b>';});}}
function openDrawer(c){closeDrawer();document.body.insertAdjacentHTML('beforeend',clientForm(c));setTimeout(()=>{const i=$('#c-name');if(i)i.focus();},30);}
function closeDrawer(){const d=$('#drawer');if(d)d.remove();}
function strip(o){const c=Object.assign({},o);delete c.id;return c;}
async function writeDoc(path,data,okMsg){
  if(!S.db)return false;
  try{await S.db.doc(path).set(data);if(okMsg)toast(okMsg);return true;}
  catch(err){const code=err&&err.code;toast(code==='invalid_argument'?'You don\'t have permission to change this.':code==='quota_exceeded'?'Storage is full. Remove unused items first.':'Couldn\'t save. Try again.');
    if(code==='invalid_argument'){S.canEdit=false;render();}return false;}
}
async function saveClient(id,btn){
  const name=$('#c-name').value.trim();if(!name){$('#c-name').focus();toast('Client name is required');return;}
  const num=v=>v===''?null:Number(v);
  const data={name,monthly:num($('#c-monthly').value),billing:$('#c-billing').value,term_months:num($('#c-term').value),start:$('#c-start').value||null,end:$('#c-end').value||null,
    client_since:$('#c-since').value||null,qb_name:$('#c-qb').value.trim()||null,notes:$('#c-notes').value.trim()||null,active:$('#c-active').checked,updated_at:new Date().toISOString()};
  if(data.start&&data.end&&data.end<data.start){toast('End date is before the start date');return;}
  btn.disabled=true;const docId=id||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const ok=await writeDoc('contracts/'+docId,data,'Saved');btn.disabled=false;if(ok)closeDrawer();
}
async function saveBudget(btn){
  if(!S.budgetDraft)return;btn.disabled=true;
  const ok=await writeDoc('budget/'+S.budgetYear,Object.assign({},S.budgetDraft,{year:Number(S.budgetYear),updated_at:new Date().toISOString()}),'Budget saved');
  if(ok)S.budgetDraft=null;else btn.disabled=false;render();
}

/* ------------------------------------------------------------- boot */
render();
(async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){S.db=false;render();return;}
  const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
  if(!db){S.db=false;render();return;}
  S.db=db;
  if(user){try{S.canEdit=!!(await user.canEdit());}catch(_){S.canEdit=false;}}
  const onErr=()=>{};
  db.collection('snapshot').onSnapshot(q=>{const s={};q.docs.forEach(d=>{if(d.exists)s[d.id]=d.data();});S.snap=s;S.loaded.snap=true;
    if(S.tab==='pipeline'&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#main')){renderProjection();renderFresh();return;}render();},onErr);
  db.collection('contracts').onSnapshot(q=>{S.contracts=q.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));S.loaded.contracts=true;if(!$('#drawer'))softRender();},onErr);
  db.collection('budget').onSnapshot(q=>{const b={};q.docs.forEach(d=>{if(d.exists)b[d.id]=d.data();});S.budgets=b;if(!S.budgetDraft)softRender();},onErr);
  db.collection('deal_models').onSnapshot(q=>{const m={};q.docs.forEach(d=>{if(d.exists)m[d.id]=d.data();});S.models=m;if(S.tab==='pipeline'){renderProjection();syncDealRows();}else softRender();},onErr);
  db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?Object.assign({},d.data()):{};if(S.tab==='pipeline')renderProjection();else softRender();},onErr);
})();
function softRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#main')&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA'))return;render();}
function syncDealRows(){document.querySelectorAll('tr[data-deal]').forEach(tr=>{const d=D().deals.find(x=>x.id===tr.dataset.deal);if(!d)return;const md=dealModel(d);
  if(tr.contains(document.activeElement))return;tr.classList.toggle('modeled',!!(md.include&&d.open));
  tr.querySelectorAll('[data-f]').forEach(el=>{const f=el.dataset.f;if(el.type==='checkbox')el.checked=!!(md.include&&d.open);else el.value=md[f];});});}
})();
</script>
