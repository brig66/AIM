<style>
/* Layout: left rail of sections (top bar on phones), one working pane; ledger-style tables, tiles only on Overview */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --sunk:#eceee9; --ink:#1c2733; --muted:#5d6873; --line:#d7dbd3;
  --accent:#126e66; --accent-ink:#ffffff; --accent-soft:#dcefeb; --amber:#b7791f; --amber-soft:#f6ead2;
  --good:#2f7d32; --warn:#b26a00; --bad:#b3261e; --good-soft:#e3f1e3; --warn-soft:#fbefd9; --bad-soft:#f8e1df;

  --display:"Spectral",Georgia,"Times New Roman",serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181e; --surface:#19222a; --sunk:#202a33; --ink:#e6eaee; --muted:#9aa6b1; --line:#2e3a45;
  --accent:#4fb3a8; --accent-ink:#0d1a19; --accent-soft:#1d3b38; --amber:#e0a84a; --amber-soft:#3a2f1c;
  --good:#7cc47f; --warn:#e6a94a; --bad:#ef7d75; --good-soft:#1f3322; --warn-soft:#3a2e1a; --bad-soft:#3d2221;
  --s1:#4fb3a8; --s2:#e0a84a; --s3:#93a6e0; --s4:#d68bb6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181e; --surface:#19222a; --sunk:#202a33; --ink:#e6eaee; --muted:#9aa6b1; --line:#2e3a45;
  --accent:#4fb3a8; --accent-ink:#0d1a19; --accent-soft:#1d3b38; --amber:#e0a84a; --amber-soft:#3a2f1c;
  --good:#7cc47f; --warn:#e6a94a; --bad:#ef7d75; --good-soft:#1f3322; --warn-soft:#3a2e1a; --bad-soft:#3d2221;
  --s1:#4fb3a8; --s2:#e0a84a; --s3:#93a6e0; --s4:#d68bb6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem;font-family:var(--body);font-weight:700}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{padding:4px 8px 16px}
.brand small{display:block;color:var(--muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.rail button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;color:var(--ink);font-weight:500;display:flex;gap:10px;align-items:center}
.rail button:hover{background:var(--sunk)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rail button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail .foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:8px}
main{padding-block:24px 64px;padding-inline:clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--mono);font-size:1.55rem;font-weight:500}
.tile .sub{font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)} .p-muted{background:var(--sunk);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right}

.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lane{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lane h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.85rem}
.checklist{display:flex;flex-direction:column;gap:6px}

.present td.best{background:var(--accent-soft)}
body.presenting .rail,body.presenting .hide-present{display:none!important}
body.presenting .app{grid-template-columns:1fr}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:50}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:2px;border-right:0;border-bottom:1px solid var(--line);z-index:5}
  .rail .brand,.rail .foot{display:none}
  .rail button{white-space:nowrap;padding:8px 10px;font-size:.88rem}
  .timeline{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.rail button,.btn{transition:background .15s}}

<script>
/* ---------- Market snapshot (fallback; the weekly refresh writes newer data to the shared store) ---------- */
const MARKET_FALLBACK = {
  updatedAt:"2026-10-06",
  months:["2024-09","2024-10","2024-11","2024-12","2025-01","2025-02","2025-03","2025-04","2025-05","2025-06","2025-07","2025-08","2025-09","2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08"],
  series:{
    cpiMedical:[3.26,3.31,3.09,2.83,2.63,2.89,2.65,2.72,2.46,2.75,3.52,3.48,3.29,null,2.90,3.15,3.19,3.36,3.05,2.54,2.59,2.03,1.70,1.56],
    cpiHospital:[4.82,4.28,4.26,3.99,3.25,3.76,3.85,3.80,3.91,4.23,5.74,5.32,5.85,null,6.00,6.70,6.88,7.59,6.38,5.55,5.78,5.47,5.43,5.53],
    cpiAll:[2.43,2.58,2.72,2.87,2.99,2.80,2.38,2.33,2.38,2.68,2.74,2.94,3.02,null,2.70,2.65,2.39,2.43,3.29,3.78,4.17,3.46,3.30,3.35],
    txUnemployment:[4.2,4.2,4.2,4.1,4.1,4.1,4.1,4.1,4.1,4.1,4.2,4.2,4.3,null,4.3,4.3,4.3,4.3,4.3,4.3,4.3,4.4,4.5,4.4],
    txBusinessApps:[39480,40652,39795,42076,33576,40756,43315,42661,43392,44829,44791,45232,50272,49900,53251,47752,49879,46125,45916,46776,49877,48491,55981,48692],
    txJobGrowth:[null,null,null,null,null,null,null,null,null,null,null,0.88,0.72,0.54,0.46,0.56,0.67,0.53,0.75,0.63,0.73,1.22,1.13,1.11]
  },
  benchmarks:{
    kffYear:2025, singlePremium:9325, familyPremium:26993, singleIncreasePct:5, familyIncreasePct:6,
    smallFirmSingle:9211, smallFirmFamily:26054, workerShareFamily:6850, employerShareFamily:20143
  },
  compliance:{
    affordability2026:9.96, affordability2027:10.22,
    hsa2027Single:4500, hsa2027Family:9000, hdhpMinDed2027Single:1750, hdhpMinDed2027Family:3500,
    hdhpMaxOop2027Single:8700, hdhpMaxOop2027Family:17400
  },
  sources:[
    {name:"CPI Medical Care (CPIMEDSL)",url:"https://fred.stlouisfed.org/series/CPIMEDSL"},
    {name:"CPI Hospital & Related Services (CUSR0000SEMD)",url:"https://fred.stlouisfed.org/series/CUSR0000SEMD"},
    {name:"CPI All Items (CPIAUCSL)",url:"https://fred.stlouisfed.org/series/CPIAUCSL"},
    {name:"Texas Unemployment Rate (TXUR)",url:"https://fred.stlouisfed.org/series/TXUR"},
    {name:"Texas Business Applications (BABATOTALSATX)",url:"https://fred.stlouisfed.org/series/BABATOTALSATX"},
    {name:"Texas Nonfarm Employment (TXNA)",url:"https://fred.stlouisfed.org/series/TXNA"},
    {name:"KFF Employer Health Benefits Survey",url:"https://www.kff.org/health-costs/report/2025-employer-health-benefits-survey/"},
    {name:"IRS ACA affordability (Rev. Proc. 2025-25, 2026-26)",url:"https://www.irs.gov/"},
    {name:"IRS HSA/HDHP limits 2027 (Rev. Proc. 2026-24)",url:"https://www.irs.gov/"},
    {name:"AHRQ MEPS-IC State Tables (Texas)",url:"https://meps.ahrq.gov/data_stats/state_tables.jsp?regionid=48&year=2025"}
  ]
};

/* ---------- Helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (v,d=0)=> (v==null||isNaN(v))?"—":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const kmoney = v => { if(v==null||isNaN(v)) return "—"; const a=Math.abs(v); return a>=1e6?"$"+(v/1e6).toFixed(2)+"M":a>=1e4?"$"+(v/1e3).toFixed(0)+"K":money(v); };
const pct = (v,d=1)=> (v==null||isNaN(v))?"—":Number(v).toFixed(d)+"%";
const numv = v => { const n=parseFloat(String(v).replace(/[$,%\s]/g,"")); return isNaN(n)?0:n; };
const today = ()=> new Date(new Date().toDateString());
const daysUntil = iso => iso ? Math.round((new Date(iso+"T00:00:00") - today())/864e5) : null;
const nextRenewal = iso => { if(!iso) return null; let d=new Date(iso+"T00:00:00"); const t=today(); while(d<t){ d.setFullYear(d.getFullYear()+1); } return d.toISOString().slice(0,10); };
const fmtDate = iso => iso? new Date(iso+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
const uid = ()=> Math.random().toString(36).slice(2,10);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* Privacy guard: blocks Social Security numbers, emails, phone numbers and health/birth details */
function piiProblems(text){
  const s=String(text||""); const out=[];
  if(/\b\d{3}-\d{2}-\d{4}\b|\b\d{9}\b/.test(s)) out.push("a Social Security or ID number");
  if(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(s)) out.push("an email address");
  if(/\(?\b\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b/.test(s)) out.push("a phone number");
  if(/\b(DOB|date of birth|born on|diagnos|pregnan|cancer|diabet|HIV|chemo|dialysis|surgery|prescription for)\b/i.test(s)) out.push("birth-date or health-condition details");
  return out;
}
function guard(...texts){ const p=piiProblems(texts.join(" \n ")); if(p.length){ toast("Not saved: remove "+p.join(", ")+". Keep personal details in your CRM."); return false;} return true; }

/* ---------- Data store: shared database when available, browser storage otherwise ---------- */
const COLS=["clients","plans","proposals"];
const state={clients:[],plans:[],proposals:[],market:MARKET_FALLBACK,tab:"overview",shared:false};
const store={
  db:null,
  async init(){
    try{ this.db = await (window.claude?.use ? window.claude.use("db") : null); }catch(e){ this.db=null; }
    if(this.db){
      state.shared=true; $("#syncState").textContent="Saved to your private shared workspace";
      COLS.forEach(c=> this.db.collection(c).onSnapshot(s=>{ state[c]=s.docs.map(d=>({...d.data(),id:d.id})); render(); }, e=>console.warn(c,e)));
      this.db.doc("market/latest").onSnapshot(s=>{ if(s.exists){ state.market={...MARKET_FALLBACK,...s.data()}; render(); } }, ()=>{});
    } else {
      $("#syncState").textContent="Working offline in this browser only";
      COLS.forEach(c=>{ try{ state[c]=JSON.parse(localStorage.getItem("bcc_"+c)||"[]"); }catch(e){ state[c]=[]; } });
      render();
    }
  },
  async save(col,obj){
    const id=obj.id||uid(); const data={...obj}; delete data.id; data.updatedAt=new Date().toISOString();
    if(this.db){ await this.db.collection(col).doc(id).set(data); }
    else { const arr=state[col].filter(x=>x.id!==id); arr.push({...data,id}); state[col]=arr; try{localStorage.setItem("bcc_"+col,JSON.stringify(arr));}catch(e){} render(); }
    return id;
  },
  async remove(col,id){
    if(this.db){ await this.db.collection(col).doc(id).delete(); }
    else { state[col]=state[col].filter(x=>x.id!==id); try{localStorage.setItem("bcc_"+col,JSON.stringify(state[col]));}catch(e){} render(); }
  }
};

/* ---------- Business math ---------- */
const TIERS=[["ee","Employee only"],["es","Employee + spouse"],["ec","Employee + child(ren)"],["ef","Family"]];
function clientRevenue(c){ const prem=numv(c.annualPremium), enr=numv(c.enrolled), r=numv(c.commissionRate);
  return c.commissionType==="pct" ? prem*r/100 : r*enr*12; }
function bookKPIs(){
  const act=state.clients.filter(c=>(c.status||"active")==="active");
  const pros=state.clients.filter(c=>c.status==="prospect");
  const yearAgo=new Date(); yearAgo.setFullYear(yearAgo.getFullYear()-1);
  const lost=state.clients.filter(c=>c.status==="lost" && (!c.lostDate || new Date(c.lostDate)>=yearAgo));
  const lives=act.reduce((a,c)=>a+numv(c.enrolled),0), eligible=act.reduce((a,c)=>a+numv(c.employees),0);
  const premium=act.reduce((a,c)=>a+numv(c.annualPremium),0), revenue=act.reduce((a,c)=>a+clientRevenue(c),0);
  const ren90=act.filter(c=>{const d=daysUntil(nextRenewal(c.renewalDate)); return d!=null&&d<=90;});
  const withInc=act.filter(c=>c.lastIncrease!==""&&c.lastIncrease!=null);
  const avgInc=withInc.length? withInc.reduce((a,c)=>a+numv(c.lastIncrease),0)/withInc.length : null;
  const lines=act.length? act.reduce((a,c)=>a+(c.lines||[]).length,0)/act.length : null;
  const carriers={}; act.forEach(c=>{ const k=(c.carrier||"Unassigned").trim(); carriers[k]=(carriers[k]||0)+clientRevenue(c); });
  const retention=(act.length+lost.length)? act.length/(act.length+lost.length)*100 : null;
  return {act,pros,lost,lives,eligible,premium,revenue,ren90,avgInc,lines,carriers,retention,
    participation: eligible? lives/eligible*100 : null,
    pipeline: pros.reduce((a,c)=>a+numv(c.annualPremium),0), pipelineRev: pros.reduce((a,c)=>a+clientRevenue(c),0)};
}
function planMonthly(plan,census,mult=1){ const r=plan.rates||{}; return TIERS.reduce((a,[k])=>a+numv(census[k])*numv(r[k])*mult,0); }
function splitCost(plan,census,contrib,mult=1){
  const r=plan.rates||{}; const eeShare=numv(contrib.eePct)/100, depShare=numv(contrib.depPct)/100; let er=0, emp=0;
  const perTier={};
  TIERS.forEach(([k])=>{ const rate=numv(r[k])*mult; const base=numv(r.ee)*mult; let erPer;
    if(contrib.mode==="flat"){ erPer=Math.min(rate, numv(contrib.flat)); }
    else { erPer = k==="ee" ? rate*eeShare : base*eeShare + Math.max(0,rate-base)*depShare; }
    perTier[k]={rate, er:erPer, emp:rate-erPer};
    er+=erPer*numv(census[k]); emp+=(rate-erPer)*numv(census[k]); });
  return {er, emp, total:er+emp, perTier};
}
function trendDefault(){ const s=state.market.series.cpiHospital.filter(v=>v!=null); return s.length? Math.round(s[s.length-1]*10)/10 : 6; }

/* ---------- Charts (inline SVG, one scale per chart) ---------- */
function lineChart(labels, series, opts={}){
  const W=640,H=220,L=40,R=12,T=12,B=26; const vals=series.flatMap(s=>s.data).filter(v=>v!=null);
  if(!vals.length) return '<div class="empty">No data yet</div>';
  let lo=Math.min(0,...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.12||1; hi+=pad; if(lo<0) lo-=pad;
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const x=i=>L+(W-L-R)*i/(labels.length-1), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='<g class="grid">'; for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3}" text-anchor="end">${opts.fmt?opts.fmt(v):+v.toFixed(1)}</text>`; } g+='</g>';
  let xl=''; labels.forEach((m,i)=>{ if(i%6===0||i===labels.length-1){ xl+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${m.slice(5)==='01'||i===0||i===labels.length-1?monthLbl(m):monthLbl(m).split(' ')[0]}</text>`; } });
  let paths=''; series.forEach((s,si)=>{ let d='',pen=false; const segs=[]; let cur=null; s.data.forEach((v,i)=>{ if(v==null){pen=false;cur=null;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); pen=true; if(!cur){cur=[];segs.push(cur);} cur.push(i); });
    if(si===0 && opts.area){ const y0=y(Math.max(lo,0)); segs.forEach(g=>{ if(g.length<2) return; paths+=`<path d="M${x(g[0])},${y0}${g.map(i=>'L'+x(i).toFixed(1)+','+y(s.data[i]).toFixed(1)).join('')}L${x(g[g.length-1])},${y0}Z" fill="${s.color}" opacity=".12"/>`; }); }
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    let li=s.data.length-1; while(li>=0&&s.data[li]==null) li--; if(li>=0) paths+=`<circle cx="${x(li)}" cy="${y(s.data[li])}" r="4" fill="${s.color}"/>`; });
  const leg=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'chart')}">${g}${xl}${paths}</svg>${leg}</div>`;
}
function barChart(labels,data,opts={}){
  const W=640,H=220,L=48,R=12,T=12,B=26; const vals=data.filter(v=>v!=null); if(!vals.length) return '<div class="empty">No data yet</div>';
  let hi=Math.max(...vals)*1.1; const step=niceStep(hi/4); hi=Math.ceil(hi/step)*step;
  const bw=(W-L-R)/labels.length, y=v=>T+(H-T-B)*(1-v/hi);
  let g='<g class="grid">'; for(let v=0; v<=hi+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3}" text-anchor="end">${opts.fmt?opts.fmt(v):v}</text>`; } g+='</g>';
  let bars=''; data.forEach((v,i)=>{ if(v==null) return; bars+=`<rect x="${L+i*bw+bw*0.15}" y="${y(v)}" width="${bw*0.7}" height="${y(0)-y(v)}" rx="2" fill="${i===data.length-1?'var(--amber)':'var(--s1)'}"><title>${monthLbl(labels[i])}: ${v.toLocaleString()}</title></rect>`; });
  let xl=''; labels.forEach((m,i)=>{ if(i%6===0||i===labels.length-1) xl+=`<text class="ax" x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${monthLbl(m)}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'chart')}">${g}${bars}${xl}</svg></div>`;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function monthLbl(m){ const [y,mo]=m.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+mo-1]+" "+y.slice(2); }
function latest(arr){ for(let i=arr.length-1;i>=0;i--) if(arr[i]!=null) return {v:arr[i],i}; return {v:null,i:-1}; }

   ${contrib.mode==="flat"?`<label class="f">Employer $ per employee / month<input type="number" data-${pfx}-contrib="flat" value="${contrib.flat}"></label>`:`<label class="f">Employer % of employee cost<input type="number" data-${pfx}-contrib="eePct" value="${contrib.eePct}"></label><label class="f">Employer % of dependent cost<input type="number" data-${pfx}-contrib="depPct" value="${contrib.depPct}"></label>`}
  </div>`;
}
function compareTable(plans,census,contrib,clientFacing){
  const costs=plans.map(p=>splitCost(p,census,contrib)); const minEr=Math.min(...costs.map(c=>c.er)); const minDed=Math.min(...plans.map(p=>numv(p.deductible)));
  const row=(lbl,fn,best)=>`<tr><th scope="row" style="text-transform:none;letter-spacing:0;font-size:.85rem">${lbl}</th>${plans.map((p,i)=>`<td class="n${best&&best(p,i)?" best":""}">${fn(p,i)}</td>`).join("")}</tr>`;
  return `<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th></th>${plans.map(p=>`<th class="n" style="text-transform:none;letter-spacing:0;color:var(--ink);font-size:.85rem">${esc(p.name)}</th>`).join("")}</tr></thead><tbody>
   ${row("Plan type",p=>esc(p.type+(p.metal&&p.metal!=="N/A"?" · "+p.metal:"")))}
   ${row("Network",p=>esc(p.network||"—"))}
   ${row("Deductible (single / family)",p=>money(numv(p.deductible))+" / "+money(numv(p.deductibleFamily)),p=>numv(p.deductible)===minDed&&clientFacing)}
   ${row("Out-of-pocket max (single)",p=>money(numv(p.oop)))}
   ${row("Plan pays after deductible",p=>p.coinsurance?p.coinsurance+"%":"—")}
   ${row("Primary care / specialist",p=>esc((p.pcp||"—")+" / "+(p.specialist||"—")))}
   ${row("Emergency room",p=>esc(p.er||"—"))}
   ${row("Generic prescriptions",p=>esc(p.rx||"—"))}
   ${TIERS.map(([k,l])=>row("Employee pays / month: "+l,(p,i)=>money(costs[i].perTier[k].emp,2))).join("")}
   ${row("Employer cost / year",(p,i)=>money(costs[i].er*12),(p,i)=>clientFacing&&costs[i].er===minEr)}
   ${row("Employees' total cost / year",(p,i)=>money(costs[i].emp*12))}
   ${row("Total premium / year",(p,i)=>`<b>${money(costs[i].total*12)}</b>`)}
  </tbody></table></div>`;
}

function aiContext(){

  if(p){ const plans=(p.planIds||[]).map(id=>state.plans.find(x=>x.id===id)).filter(Boolean);
    parts.push(`Proposal census (counts by tier): ${TIERS.map(([k,l])=>l+" "+numv(p.census[k])).join(", ")}. Employer contribution: ${p.contrib.mode==="flat"?money(numv(p.contrib.flat))+"/employee/month":p.contrib.eePct+"% employee, "+p.contrib.depPct+"% dependents"}.`);
    plans.forEach(pl=>{ const s=splitCost(pl,p.census,p.contrib); parts.push(`Plan "${pl.name}" (${pl.type}${pl.metal&&pl.metal!=="N/A"?", "+pl.metal:""}, network ${pl.network||"n/a"}): deductible ${money(numv(pl.deductible))} single/${money(numv(pl.deductibleFamily))} family, OOP max ${money(numv(pl.oop))}, coinsurance ${pl.coinsurance||"n/a"}%, PCP ${pl.pcp||"n/a"}, specialist ${pl.specialist||"n/a"}, ER ${pl.er||"n/a"}, generic Rx ${pl.rx||"n/a"}. Monthly rates EE ${money(numv(pl.rates?.ee),2)}, ES ${money(numv(pl.rates?.es),2)}, EC ${money(numv(pl.rates?.ec),2)}, EF ${money(numv(pl.rates?.ef),2)}. Annual: total ${money(s.total*12)}, employer ${money(s.er*12)}, employees ${money(s.emp*12)}.`); }); }
  const M=state.market; parts.push(`Market context: medical care CPI ${pct(latest(M.series.cpiMedical).v)} YoY, hospital services CPI ${pct(latest(M.series.cpiHospital).v)} YoY; KFF ${M.benchmarks.kffYear} average premiums ${money(M.benchmarks.singlePremium)} single / ${money(M.benchmarks.familyPremium)} family; ACA affordability ${M.compliance.affordability2026}% (2026), ${M.compliance.affordability2027}% (2027).`);

async function runAI(){
  const prob=piiProblems(ai.text); if(prob.length){ toast("Remove "+prob.join(", ")+" before sending."); return; }
  const sample=await window.claude?.use?.("sample"); if(!sample){ ai.available=false; render(); return; }
  ai.busy=true; ai.out=""; ai.ctrl=new AbortController(); render();
  const sys=`You assist an independent employee-benefits broker in Texas who serves small and medium-sized employers. Task: ${AI_TASKS[ai.task].label}.
Rules: Write in plain US English for a business owner. Use only the facts given below; do not invent carrier names, rates, or plan details. Where a figure is needed but not given, leave a clearly marked [placeholder]. Never ask for or include personal or health information about employees. Refer to the client by the placeholder [Client Name] rather than the code. Keep it concise and ready to send. For research questions, note any facts the broker should verify, and keep Texas and federal (ACA, ERISA, COBRA, Texas state continuation) rules in mind.

Context:
${aiContext()}

Broker's request:
${ai.text||"(no extra details)"}`;
  try{
    const r=await sample(sys,{signal:ai.ctrl.signal,modelTier:ai.task==="research"||ai.task==="transition"?"complex":"default",cache:false,onText:u=>{ ai.out=u.text; const o=$("#ai_out"); if(o) o.textContent=u.text; }});
    ai.out=r.text+(r.truncated?"\n\n[Draft was cut short. Ask again with a narrower request.]":"");
  }catch(e){
    if(e?.code==="not_granted"){ ai.available=false; } else if(e?.code!=="cancelled"){ ai.out=(e?.text||"")+`\n\n[Could not finish: ${e?.message||"unknown error"}${e?.code==="rate_limited"?" — wait a minute and try again.":""}]`; }
  }
  ai.busy=false; render();
}

  if(t.dataset.check){ openChecklist=t.dataset.check; render(); return; }
  if(t.id==="resetCk"){ const c=state.clients.find(x=>x.id===openChecklist); if(c){ await store.save("clients",{...c,checklist:{}}); toast("Checklist reset"); } return; }
  if(t.id==="cancelPlan"){ editPlan=null; render(); return; }
  if(t.dataset.editPlan){ editPlan=state.plans.find(p=>p.id===t.dataset.editPlan); render(); window.scrollTo(0,0); return; }
  if(t.dataset.delPlan){ if(t.dataset.confirm!=="1"){ t.dataset.confirm="1"; t.textContent="Confirm delete"; return; } compareSel=compareSel.filter(x=>x!==t.dataset.delPlan); await store.remove("plans",t.dataset.delPlan); toast("Plan deleted"); return; }
  if(t.id==="saveProp"){ const code=$("#propCode").value.trim(); if(!code){ toast("Enter a client code for this proposal"); return; } if(!guard(code)) return;
    await store.save("proposals",{clientCode:code,planIds:[...compareSel],census:{...compareCensus},contrib:{...compareContrib}}); toast("Proposal saved. Open Present to Client to show it."); return; }
  if(t.dataset.delProp){ if(t.dataset.confirm!=="1"){ t.dataset.confirm="1"; t.textContent="Confirm delete"; return; } await store.remove("proposals",t.dataset.delProp); presentSel=""; toast("Proposal deleted"); return; }
  if(t.id==="startPresent"){ document.body.classList.add("presenting"); window.scrollTo(0,0); return; }
  if(t.id==="stopPresent"){ document.body.classList.remove("presenting"); return; }
  if(t.id==="ai_go"){ runAI(); return; }
  if(t.id==="ai_stop"){ ai.ctrl?.abort(); return; }
  if(t.id==="ai_copy"){ try{ await navigator.clipboard.writeText(ai.out); toast("Copied"); }catch(err){ const r=document.createRange(); r.selectNodeContents($("#ai_out")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected. Press Ctrl+C or Cmd+C to copy."); } return; }
});

document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="clientForm"){
    const g=id=>$("#"+id).value.trim();
    const obj={...(editClient||{}),code:g("c_code"),status:g("c_status"),industry:g("c_industry"),region:g("c_region"),employees:g("c_employees"),enrolled:g("c_enrolled"),carrier:g("c_carrier"),funding:g("c_funding"),annualPremium:g("c_premium"),commissionType:g("c_ctype"),commissionRate:g("c_crate"),renewalDate:g("c_renewal"),lastIncrease:g("c_inc"),lostDate:g("c_lost"),notes:g("c_notes"),lines:[...document.querySelectorAll('input[name="c_lines"]:checked')].map(x=>x.value)};
    if(!obj.code){ toast("Enter a client code"); return; }
    if(!guard(obj.code,obj.notes,obj.industry,obj.carrier,obj.region)) return;
    await store.save("clients",obj); toast(editClient?"Group updated":"Group added"); editClient=null; render();
  }
  if(e.target.id==="planForm"){
    const g=id=>$("#"+id).value.trim();
    const obj={...(editPlan||{}),name:g("p_name"),carrier:g("p_carrier"),type:g("p_type"),metal:g("p_metal"),network:g("p_network"),deductible:g("p_ded"),deductibleFamily:g("p_dedf"),oop:g("p_oop"),coinsurance:g("p_coins"),pcp:g("p_pcp"),specialist:g("p_spec"),er:g("p_er"),rx:g("p_rx"),rates:Object.fromEntries(TIERS.map(([k])=>[k,g("p_r_"+k)]))};
    if(!guard(obj.name,obj.carrier,obj.network)) return;
    await store.save("plans",obj); toast(editPlan?"Plan updated":"Plan added"); editPlan=null; render();
  }
});

document.addEventListener("change",async e=>{
  const t=e.target, d=t.dataset;
  if(d.cmp){ if(t.checked){ if(compareSel.length>=4){ t.checked=false; toast("Compare up to four plans at a time"); return; } compareSel.push(d.cmp);} else compareSel=compareSel.filter(x=>x!==d.cmp); render(); return; }
  if(d.ck){ const c=state.clients.find(x=>x.id===openChecklist); if(c){ await store.save("clients",{...c,checklist:{...(c.checklist||{}),[d.ck]:t.checked}}); } return; }
  if(t.id==="wi_base"){ wi.base=t.value; render(); return; }
  if(t.id==="wi_alt"){ wi.alt=t.value; render(); return; }
  if(t.id==="pr_sel"){ presentSel=t.value; render(); return; }
  if(t.id==="ai_task"){ ai.task=t.value; render(); return; }
  if(t.id==="ai_client"){ ai.client=t.value; return; }
  if(t.id==="ai_prop"){ ai.proposal=t.value; return; }
  if(d.cmpContrib==="mode"){ compareContrib.mode=t.value; render(); return; }
  if(d.wiContrib==="mode"){ wi.contrib.mode=t.value; render(); return; }
  if(d.wiaContrib==="mode"){ wi.altContrib.mode=t.value; render(); return; }
  if(d.cmpCensus||d.cmpContrib||d.wiCensus||d.wiContrib||d.wiaContrib||/^wi_/.test(t.id)) render();
});
document.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(d.cmpCensus) compareCensus[d.cmpCensus]=numv(t.value);
  else if(d.cmpContrib && d.cmpContrib!=="mode") compareContrib[d.cmpContrib]=numv(t.value);
  else if(d.wiCensus) wi.census[d.wiCensus]=numv(t.value);
  else if(d.wiContrib && d.wiContrib!=="mode") wi.contrib[d.wiContrib]=numv(t.value);
  else if(d.wiaContrib && d.wiaContrib!=="mode") wi.altContrib[d.wiaContrib]=numv(t.value);
  else if(t.id==="wi_inc") wi.increase=numv(t.value);
  else if(t.id==="wi_trend") wi.trend=numv(t.value);
  else if(t.id==="wi_wage") wi.wage=numv(t.value);
  else if(t.id==="pr_title") presentTitle=t.value;
  else if(t.id==="ai_text") ai.text=t.value;
});

try{ const t=localStorage.getItem("bcc_tab"); if(t&&views[t]) state.tab=t; }catch(e){}
render();
store.init();
</script>
